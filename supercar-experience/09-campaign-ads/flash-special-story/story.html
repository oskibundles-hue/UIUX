<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>SE STO Flash Special</title>
<!--
  Supercar Experience, Lamborghini Huracán STO, 2-hour flash special. Story 9:16, 15.5 s, 24 fps.
  Motion-graphics layer only (transparent). The plate is composited underneath by build_story.py.
  window.renderAt(t) sets every element for time t (seconds). Pure function of t: no CSS animation,
  no transitions, no rAF, no clock, no randomness. window.storyReady resolves once fonts are in and
  the layout (cap-top metrics) is built. Timings follow cue.md section 2.
-->
<style>
@font-face{font-family:'SEBebas';src:url('../../07-fonts/BebasNeue-Regular.ttf') format('truetype')}
@font-face{font-family:'SEMichroma';src:url('../../07-fonts/Michroma-Regular.ttf') format('truetype')}
:root{--gold:#FBD101;--white:#FFFFFF;--black:#000000}
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
.a{position:absolute;left:0;top:0}
.lyr{position:absolute;left:0;top:0;width:1080px;height:1920px}
.g{color:var(--gold)}
.w{color:var(--white)}
.stripe{background:linear-gradient(90deg,var(--gold) 0 78%,var(--white) 78% 100%)}
.cn{position:absolute;box-sizing:border-box;border:0 solid var(--gold)}
.dm{display:inline-block;width:9px;height:9px;background:var(--gold);transform:rotate(45deg);
    margin:0 22px 0 calc(22px - .14em);vertical-align:middle;position:relative;top:-2px}
</style></head>
<body><div id="stage"></div>
<script>
(function(){
'use strict';
const W = 1080, H = 1920;
const X = f => f * W, Y = f => f * H;
const GOLD = [251, 209, 1], WHITE = [255, 255, 255];
const FONT = { B: 'SEBebas', M: 'SEMichroma' };

/* ---------- easing + timing helpers (all pure) ---------- */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const P = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: p => p,
  oExpo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
  oCub: p => 1 - Math.pow(1 - p, 3),
  iCub: p => p * p * p,
  ioCub: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  ioQuad: p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2,
  oBack: (p, s = 1.2) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2),
};
const EPS = 1e-4;
// visible in [a, b): cue times are 3-decimal renderings of frame boundaries (9.417 = frame 226 = 9.41667),
// so compare on the 24 fps frame grid
const FR = x => Math.round(x * 24 - 1e-6);
const on = (t, a, b) => { const f = FR(t); return f >= FR(a) && f < FR(b); };
const ease = (t, a, b, fn) => fn(P(t, a, b));
const rgb = (c1, c2, p) => `rgb(${c1.map((v, i) => Math.round(lerp(v, c2[i], p))).join(',')})`;

/* ---------- DOM helpers ---------- */
const stage = document.getElementById('stage');
function el(tag, cls, parent, css) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (css) e.style.cssText = css;
  (parent || stage).appendChild(e);
  return e;
}
function layer() { return el('div', 'lyr', stage); }
function st(e, o) {                                              // set transform / opacity / clip in one go
  const tr = [];
  if (o.tx || o.ty) tr.push(`translate(${(o.tx || 0).toFixed(2)}px,${(o.ty || 0).toFixed(2)}px)`);
  if (o.sx != null || o.sy != null) tr.push(`scale(${o.sx == null ? 1 : o.sx},${o.sy == null ? 1 : o.sy})`);
  else if (o.s != null && o.s !== 1) tr.push(`scale(${o.s})`);
  e.style.transform = tr.join(' ');
  e.style.opacity = o.o == null ? 1 : o.o;
  e.style.display = (o.o === 0) ? 'none' : '';
  e.style.clipPath = o.clip || 'none';
}
function hide(e) { e.style.display = 'none'; }

/* cap-top metrics per font/size, measured with canvas once the fonts are loaded */
const ctx = document.createElement('canvas').getContext('2d');
const mcache = {};
function met(f, fs) {
  const k = f + fs;
  if (!mcache[k]) {
    ctx.font = `${fs}px ${FONT[f]}`;
    const m = ctx.measureText('H');
    mcache[k] = { asc: m.fontBoundingBoxAscent, desc: m.fontBoundingBoxDescent, cap: m.actualBoundingBoxAscent };
  }
  return mcache[k];
}

/* A text line placed by its cap top. wrap = mask box (overflow toggled per frame), inner = the text.
   align: left (x = left edge), right (x = right edge), center (x = centre). */
function line(parent, o) {
  const f = o.f, fs = o.fs, ls = o.ls || 0, m = met(f, fs);
  const L = Math.ceil(m.asc + m.desc);
  const padT = Math.ceil(fs * .42), padB = Math.ceil(fs * .32), padX = 48;
  const wrap = el('div', 'a', parent);
  const inner = el('div', o.cls || 'w', wrap,
    `position:absolute;left:${padX}px;top:${(padT - (m.asc - m.cap) + (L - m.asc - m.desc) / 2).toFixed(2)}px;` +
    `font-family:${FONT[f]};font-size:${fs}px;line-height:${L}px;letter-spacing:${ls}em;white-space:nowrap;` +
    (o.align === 'center' ? `text-indent:${ls}em;` : '') + (o.shadow ? `text-shadow:${o.shadow};` : ''));
  inner.innerHTML = o.html;
  const wRaw = inner.getBoundingClientRect().width;
  const lsPx = ls * fs;
  const vis = o.align === 'center' ? wRaw - 2 * lsPx : wRaw - lsPx; // visible ink advance
  const left = o.align === 'right' ? o.x - vis : o.align === 'center' ? o.x - vis / 2 - lsPx : o.x;
  const wh = padT + m.cap + padB;
  wrap.style.cssText = `left:${(left - padX).toFixed(2)}px;top:${(o.cap - padT).toFixed(2)}px;width:${Math.ceil(wRaw + 2 * padX)}px;height:${wh}px;`;
  return { wrap, inner, vis, left, capTop: o.cap, capH: m.cap, base: o.cap + m.cap, padX, padT, wh, wRaw,
           mid: o.cap + m.cap / 2, right: left + vis, origin: `${padX}px ${padT + m.cap}px` };
}
/* per-frame state of a line */
function L(ln, s) {
  // s: {o, tx, ty, s, origin, rise (0..1 of masked rise, 1 = settled), up (0..1 masked exit upward),
  //     clipR (0..1 visible fraction from left), clipL (0..1 hidden fraction from left), color}
  if (s.o === 0) { hide(ln.wrap); return; }
  const rise = s.rise == null ? 1 : s.rise, up = s.up || 0;
  const masking = rise < 1 || up > 0;
  ln.wrap.style.overflow = masking ? 'hidden' : 'visible';
  ln.inner.style.transform = masking ? `translateY(${((1 - rise) * 1.05 * ln.wh - up * 1.05 * ln.wh).toFixed(2)}px)` : 'none';
  let clip = null;
  if (s.clipR != null && s.clipR < 1) {
    const vis = ln.padX + s.clipR * ln.vis;
    clip = `inset(-60px ${Math.max(0, ln.wRaw + 2 * ln.padX - vis).toFixed(2)}px -60px -60px)`;
  } else if (s.clipL != null && s.clipL > 0) {
    clip = `inset(-60px -60px -60px ${(ln.padX + s.clipL * ln.vis).toFixed(2)}px)`;
  }
  ln.wrap.style.transformOrigin = s.origin || ln.origin;
  st(ln.wrap, { o: s.o == null ? 1 : s.o, tx: s.tx, ty: s.ty, s: s.s, clip });
  if (s.color) ln.inner.style.color = s.color;
}

/* a horizontal stripe (gold 78 / white 22), revealed by clip */
function stripe(parent, x, y, w, h) {
  return el('div', 'a stripe', parent, `left:${x}px;top:${y}px;width:${w}px;height:${h}px`);
}
function stripeReveal(e, p, mode) {                          // mode: 'lr' (left->right), 'rl' retract, 'center'
  if (p <= 0) return 'inset(0 100% 0 0)';
  if (p >= 1) return 'none';
  if (mode === 'center') return `inset(0 ${(50 * (1 - p)).toFixed(3)}% 0 ${(50 * (1 - p)).toFixed(3)}%)`;
  return `inset(0 ${(100 * (1 - p)).toFixed(3)}% 0 0)`;
}

/* L-brackets. corners: subset of ['tl','tr','bl','br'] */
function brackets(parent, stroke, arm, corners, alpha) {
  const g = el('div', 'lyr', parent);
  const cs = {};
  (corners || ['tl', 'tr', 'bl', 'br']).forEach(k => {
    const c = el('div', 'cn', g);
    c.style.borderTopWidth = k[0] === 't' ? stroke + 'px' : 0;
    c.style.borderBottomWidth = k[0] === 'b' ? stroke + 'px' : 0;
    c.style.borderLeftWidth = k[1] === 'l' ? stroke + 'px' : 0;
    c.style.borderRightWidth = k[1] === 'r' ? stroke + 'px' : 0;
    cs[k] = c;
  });
  return {
    g, set(l, t, r, b, o, armScale) {
      if (o <= 0) { hide(g); return; }
      const a = arm * (armScale == null ? 1 : armScale);
      for (const k in cs) {
        const c = cs[k];
        c.style.width = a + 'px'; c.style.height = a + 'px';
        c.style.left = (k[1] === 'l' ? l : r - a).toFixed(2) + 'px';
        c.style.top = (k[0] === 't' ? t : b - a).toFixed(2) + 'px';
        c.style.display = a < .5 ? 'none' : '';
      }
      st(g, { o: o * (alpha == null ? 1 : alpha) });
    }
  };
}
/* a horizontal scan line with a soft trail above it (moving down) */
function scanLine(parent, thick, alpha) {
  const g = el('div', 'a', parent, `left:0;top:0;width:${W}px;height:${thick}px`);
  el('div', 'a', g, `left:0;top:${-110}px;width:${W}px;height:110px;background:linear-gradient(to bottom,rgba(251,209,1,0),rgba(251,209,1,.22))`);
  el('div', 'a', g, `left:0;top:0;width:${W}px;height:${thick}px;background:var(--gold);box-shadow:0 0 14px rgba(251,209,1,.8)`);
  return { g, alpha };
}
function scanSet(sl, t, a, b) {
  if (!on(t, a, b + 1 / 24)) { hide(sl.g); return; }        // frames a..b inclusive
  const p = P(t, a, b);
  st(sl.g, { ty: lerp(Y(.14), Y(.86), p), o: sl.alpha });
}

/* ---------- build ---------- */
let R = null;                                                // element registry, filled by build()
function build() {
  R = {};
  const SH_B3 = '0 2px 18px rgba(0,0,0,.45)';
  const SH_B8 = '0 2px 14px rgba(0,0,0,.35)';
  const x0 = X(.075);                                          // 81 px, the type column

  /* 1. hook scrim */
  R.hookScrim = el('div', 'lyr', stage,
    'background:linear-gradient(to bottom,rgba(0,0,0,0) 12%,rgba(0,0,0,.45) 18%,rgba(0,0,0,.45) 32%,rgba(0,0,0,0) 38%)');
  /* 2. mid scrim */
  R.midScrim = el('div', 'lyr', stage,
    'background:linear-gradient(to bottom,rgba(0,0,0,0) 34%,rgba(0,0,0,.80) 38%,rgba(0,0,0,.80) 62%,rgba(0,0,0,0) 66%)');
  /* 3. tag plate (B2) */
  const tagL = layer();
  R.tagPlate = el('div', 'a', tagL, `left:54px;top:374px;width:616px;height:202px;background:rgba(0,0,0,.85)`);
  R.tagStripe = stripe(R.tagPlate, 0, 196, 616, 6);
  /* 4. title block */
  R.title = layer();
  el('div', 'a', R.title, `left:54px;top:1238px;width:853px;height:183px;background:rgba(0,0,0,.80)`);
  R.titleBr = brackets(R.title, 4, 40, ['tl', 'br']);
  const mark = el('img', 'a', R.title, `left:${x0}px;top:${(Y(.6925) - 28).toFixed(1)}px;height:56px;width:88px`);
  mark.src = '../../02-logos/png/sce-icon-mark-only--white.png';
  R.titleName = line(R.title, { f: 'B', fs: 64, x: 197, cap: Y(.662), html: 'LAMBORGHINI HURACÁN STO', cls: 'w' });
  R.titleSub = line(R.title, { f: 'M', fs: 22, x: 197, cap: Y(.703), ls: .2, html: '2023 · LAS VEGAS', cls: 'g' });
  R.titleStripe = stripe(R.title, R.titleSub.right + 24, R.titleSub.mid - 3, 200, 6);
  /* 5. ticker */
  R.ticker = layer();
  el('div', 'a', R.ticker, `left:0;top:1463px;width:${W}px;height:50px;background:rgba(0,0,0,.85)`);
  const tmask = el('div', 'a', R.ticker, `left:0;top:1440px;width:${W}px;height:100px;` +
    '-webkit-mask-image:linear-gradient(to right,transparent 3%,#000 7%,#000 93%,transparent 97%);' +
    'mask-image:linear-gradient(to right,transparent 3%,#000 7%,#000 93%,transparent 97%)');
  const tm = met('M', 22);
  const tickerHTML = 'SUPERCAR EXPERIENCE<i class="dm"></i>2-HOUR RENTAL FLASH SPECIAL<i class="dm"></i>11AM – 1PM PT TODAY<i class="dm"></i>SUPERCAREXP.VIP<i class="dm"></i>';
  R.tickerRun = el('div', 'a w', tmask, `white-space:nowrap;font-family:${FONT.M};font-size:22px;letter-spacing:.14em;` +
    `line-height:${Math.ceil(tm.asc + tm.desc)}px;top:${(Y(.775) - 1440 - tm.cap / 2 - (tm.asc - tm.cap)).toFixed(2)}px`);
  const one = el('span', '', R.tickerRun); one.innerHTML = tickerHTML;
  R.tickerLoop = one.getBoundingClientRect().width;
  for (let i = 0; i < 3; i++) { const s = el('span', '', R.tickerRun); s.innerHTML = tickerHTML; }
  /* 6/7. brackets */
  const brL = layer();
  R.brA = brackets(brL, 6, 70);                                // B2 crest lock
  R.brB = brackets(brL, 6, 50);                                // B3 STO lock
  R.brC = brackets(brL, 4, 40, null, .5);                      // B8 soft lock
  /* 8. type */
  const ty = layer();
  // B1 hook
  R.h1 = line(ty, { f: 'B', fs: 210, x: x0, cap: Y(.150), html: '2-HOUR', cls: 'g' });
  R.h2 = line(ty, { f: 'B', fs: 150, x: x0, cap: Y(.242), html: 'FLASH SPECIAL', cls: 'w' });
  R.h3 = line(ty, { f: 'M', fs: 34, x: x0, cap: Y(.316), ls: .18, html: 'ENDS TODAY · <span class="g">1PM PT</span>', cls: 'w' });
  R.hS = stripe(ty, x0, 651, 180, 8);
  // B2 tag
  R.tBrand = line(ty, { f: 'M', fs: 22, x: x0, cap: Y(.212), ls: .22, html: 'BRAND', cls: 'g' });
  R.tLambo = line(ty, { f: 'B', fs: 110, x: x0, cap: Y(.234), html: 'LAMBORGHINI', cls: 'w' });
  // B3 model
  R.mModel = line(ty, { f: 'M', fs: 22, x: x0, cap: Y(.342), ls: .22, html: 'MODEL · 2023', cls: 'g', shadow: SH_B3 });
  R.mName = line(ty, { f: 'B', fs: 120, x: x0, cap: Y(.372), html: 'HURACÁN STO', cls: 'w', shadow: SH_B3 });
  // B4 readout
  R.ro = el('div', 'lyr', ty);
  R.roHead = line(R.ro, { f: 'M', fs: 24, x: x0, cap: Y(.410), ls: .2, html: 'RENTAL FLASH WINDOW · TODAY', cls: 'g' });
  R.roStripe = stripe(R.ro, x0, Y(.432), 300, 8);
  const ty0 = Y(.490), tx1 = X(.80);
  R.track = el('div', 'a', R.ro, `left:${x0}px;top:${(ty0 - 3).toFixed(1)}px;width:${tx1 - x0}px;height:6px;transform-origin:0 50%`);
  el('div', 'a', R.track, `left:0;top:0;width:100%;height:6px;background:rgba(255,255,255,.35)`);
  el('div', 'a', R.track, `left:0;top:-9px;width:3px;height:24px;background:#fff`);
  el('div', 'a', R.track, `left:${tx1 - x0 - 3}px;top:-9px;width:3px;height:24px;background:#fff`);
  R.fill = el('div', 'a', R.ro, `left:${x0}px;top:${(ty0 - 5).toFixed(1)}px;width:${tx1 - x0}px;height:10px;background:var(--gold);transform-origin:0 50%`);
  R.dot = el('div', 'a', R.ro, `left:${x0 - 9}px;top:${(ty0 - 9).toFixed(1)}px;width:18px;height:18px;border-radius:50%;background:var(--gold);box-shadow:0 0 16px rgba(251,209,1,.7)`);
  R.pulse = el('div', 'a', R.ro, `left:${tx1 - 1.5 - 12}px;top:${(ty0 - 12).toFixed(1)}px;width:24px;height:24px;box-sizing:border-box;border:2px solid var(--gold);border-radius:50%`);
  R.l11 = line(R.ro, { f: 'B', fs: 96, x: x0, cap: Y(.512), html: '11AM', cls: 'w' });
  R.l1 = line(R.ro, { f: 'B', fs: 96, x: tx1, cap: Y(.512), html: '1PM', cls: 'w', align: 'right' });
  // B5/B6 requirements
  R.rq = el('div', 'lyr', ty);
  R.rqHead = line(R.rq, { f: 'M', fs: 24, x: x0, cap: Y(.400), ls: .2, html: 'REQUIREMENTS', cls: 'g' });
  R.rqStripe = stripe(R.rq, x0, Y(.422), 300, 8);
  const rows = [['01', 'VALID DRIVER’S LICENSE'], ['02', '21+'], ['03', 'INSURANCE']];
  const rcaps = [.450, .506, .562];
  const bm = met('B', 80), im = met('M', 26);
  R.rows = rows.map((r, i) => {
    const cap = Y(rcaps[i]);
    const lab = line(R.rq, { f: 'B', fs: 80, x: X(.16), cap, html: r[1], cls: 'w' });
    const idx = line(R.rq, { f: 'M', fs: 26, x: x0, cap: cap + bm.cap - im.cap, html: r[0], cls: 'g' });
    const scan = el('div', 'a', R.rq, `left:${x0}px;top:${(lab.mid - 2).toFixed(1)}px;width:${tx1 - x0}px;height:4px;` +
      'background:linear-gradient(to right,rgba(251,209,1,0),rgba(251,209,1,.55) 60%,var(--gold));transform-origin:0 50%;box-shadow:0 0 10px rgba(251,209,1,.5)');
    const pip = el('div', 'a', R.rq, `left:${tx1 - 7}px;top:${(lab.mid - 7).toFixed(1)}px;width:14px;height:14px;background:var(--gold)`);
    return { lab, idx, scan, pip };
  });
  // B8 ask
  R.ask1 = line(ty, { f: 'B', fs: 120, x: x0, cap: Y(.610), html: 'BOOK BEFORE <span class="g">1PM PT</span>', cls: 'w', shadow: SH_B8 });
  R.ask2 = line(ty, { f: 'M', fs: 26, x: x0, cap: Y(.673), ls: .14, html: 'CALL FOR THE FLASH RATE', cls: 'w', shadow: SH_B8 });
  R.ask3 = line(ty, { f: 'M', fs: 40, x: x0, cap: Y(.696), ls: .04, html: '(888) 678-6079', cls: 'g', shadow: SH_B8 });
  R.askS = stripe(ty, x0, Y(.726), 320, 8);
  /* 9. scan lines and pulses */
  const fx = layer();
  R.scan1 = scanLine(fx, 3, .7);
  R.scan2 = scanLine(fx, 3, .6);
  /* 10. end card */
  R.end = el('div', 'lyr', stage, 'background:#000');
  R.logo = el('img', 'a', R.end, `left:${540 - 280}px;top:547px;width:560px;height:333px;transform-origin:50% 50%`);
  R.logo.src = '../../02-logos/png/sce-stacked--white.png';
  R.endS = stripe(R.end, 540 - 180, Y(.486), 360, 8);
  R.endK = line(R.end, { f: 'M', fs: 26, x: 540, cap: Y(.505), ls: .2, html: 'RENTAL FLASH SPECIAL', cls: 'w', align: 'center' });
  R.endH = line(R.end, { f: 'B', fs: 92, x: 540, cap: Y(.525), html: 'ENDS TODAY · 1PM PT', cls: 'g', align: 'center' });
  R.endC = [
    line(R.end, { f: 'M', fs: 32, x: 540, cap: Y(.589), ls: .16, html: 'SUPERCAREXP.VIP', cls: 'w', align: 'center' }),
    line(R.end, { f: 'M', fs: 32, x: 540, cap: Y(.622), ls: .08, html: '(888) 678-6079', cls: 'w', align: 'center' }),
    line(R.end, { f: 'M', fs: 26, x: 540, cap: Y(.655), ls: .12, html: '@SUPERCAR_EXPERIENCE_', cls: 'w', align: 'center' }),
  ];
}

/* ---------- render: every element is a pure function of t ---------- */
/* Cut points (24 fps frame boundaries, cue.md section 1):
   B1 0.000 | B2 1.833 | B3 2.792 | B4 4.458 | B5 5.833 | B7 7.250 | B6 8.292 | B8 10.125 | B9 13.042 | end 15.500
   B3, B4 and the requirements build keep the approved round-0 motion, shifted 7 frames earlier (u = t + S7);
   the ask keeps its entry motion shifted 21 frames (v = t + S21). Exits are re-anchored in real time. */
const S7 = 7 / 24, S21 = 21 / 24;
const T_B2 = 1.833, T_B3 = 2.792, T_B8 = 10.125, T_B9 = 13.042;
const HUD_OUT = 8.083, HUD_END = 8.292;                         // everything HUD is gone at the B6 cut (frame 199)
const ASK_OUT = 12.583, ASK_END = 12.750;                       // 0.29 s of clean footage before the end card
/* B8 car nose (x fraction) on the plate, measured per frame (cue.md D14); brackets sit 2% outside it */
const NOSE = [[10.125, .835], [10.625, .860], [11.250, .895], [11.875, .912], [12.500, .937], [12.875, .946]];
function noseAt(t) {
  if (t <= NOSE[0][0]) return NOSE[0][1];
  for (let i = 1; i < NOSE.length; i++) if (t <= NOSE[i][0]) {
    const [t0, x0] = NOSE[i - 1], [t1, x1] = NOSE[i];
    return lerp(x0, x1, (t - t0) / (t1 - t0));
  }
  return NOSE[NOSE.length - 1][1];
}

function renderAt(t) {
  if (!R) return;
  const x0 = X(.075);
  const u = t + S7, v = t + S21;

  /* ===== B1 HOOK 0.000-1.833 ===== */
  if (on(t, 0, 1.833)) {
    R.hookScrim.style.opacity = 1 - P(t, 1.667, 1.833);
    R.hookScrim.style.display = '';
    const ex = ease(t, 1.667, 1.833, E.iCub), exT = -30 * ex, exO = 1 - ex;
    L(R.h1, { s: lerp(1.06, 1, ease(t, 0, .292, E.oExpo)), ty: exT, o: exO });
    L(R.h2, { s: lerp(1.04, 1, ease(t, .083, .333, E.oExpo)), ty: exT, o: exO });
    const p3 = ease(t, .292, .625, E.oCub);
    L(R.h3, { o: p3 * exO, ty: 20 * (1 - p3) + exT });
    const ps = ease(t, .417, .792, E.oCub), pr = ease(t, 1.667, 1.833, E.iCub);
    st(R.hS, { o: exO, ty: exT, clip: t < 1.667 ? stripeReveal(R.hS, ps, 'lr') : stripeReveal(R.hS, 1 - pr, 'lr') });
  } else { hide(R.hookScrim); [R.h1, R.h2, R.h3].forEach(l => L(l, { o: 0 })); hide(R.hS); }

  /* ===== B2 BRAND LOCK 1.833-2.792 (the whole crest take at 1.0x, 23 frames) ===== */
  if (on(t, T_B2, T_B3)) {
    const pc = ease(t, 1.875, 2.208, E.oExpo);
    let l = lerp(X(.05), X(.06), pc), r = lerp(X(.95), X(.94), pc), tp = lerp(Y(.15), Y(.32), pc), b = lerp(Y(.80), Y(.77), pc);
    const tick = on(t, 2.208, 2.333) ? 8 * Math.sin(Math.PI * P(t, 2.208, 2.333)) : 0;
    const rel = ease(t, 2.708, 2.792, E.oCub);
    const d = tick - 20 * rel;
    l += d; r -= d; tp += d; b -= d;
    R.brA.set(l, tp, r, b, P(t, T_B2, 1.917) * (1 - rel));
    const pp = ease(t, 1.875, 2.167, E.oCub);
    st(R.tagPlate, { tx: -24 * (1 - pp), o: pp });
    st(R.tagStripe, { clip: stripeReveal(R.tagStripe, ease(t, 1.958, 2.250, E.oCub), 'lr') });
    L(R.tBrand, { o: P(t, 1.917, 2.125) });
    L(R.tLambo, { rise: ease(t, 1.875, 2.208, E.oExpo), o: t < 1.875 ? 0 : 1 });
  } else { R.brA.set(0, 0, 0, 0, 0); hide(R.tagPlate); L(R.tBrand, { o: 0 }); L(R.tLambo, { o: 0 }); }

  /* ===== B3 MODEL LOCK 2.792-4.458 (round-0 motion at u = t + 7 frames) ===== */
  if (on(u, 3.083, 4.750)) {
    const pin = P(u, 3.083, 3.125), pc = ease(u, 3.125, 3.500, E.oExpo);
    // the STO lettering drifts/grows in the take (measured x 23.2-76.1% -> 19.8-78.8% over the shot),
    // so the lock box tracks it, keeping ~3% clear of the letters
    const bl = .20 - .0307 * (u - 3.5), bri = .80 + .0227 * (u - 3.5);
    let l = lerp(X(.035), X(bl), pc), r = lerp(X(.965), X(bri), pc), tp = lerp(Y(.15), Y(.455), pc), b = lerp(Y(.80), Y(.535), pc);
    const tick = on(u, 3.500, 3.625) ? 8 * Math.sin(Math.PI * P(u, 3.500, 3.625)) : 0;
    const rel = ease(u, 4.583, 4.667, E.oCub);
    const d = tick - 20 * rel;
    l += d; r -= d; tp += d; b -= d;
    R.brB.set(l, tp, r, b, Math.max(pin, u >= 3.125 ? 1 : 0) * (1 - rel));
    const up = ease(u, 4.583, 4.708, E.iCub);
    L(R.mModel, { o: u < 3.250 || up >= 1 ? 0 : 1, clipR: ease(u, 3.250, 3.583, E.oCub), up });
    L(R.mName, { o: u < 3.167 || up >= 1 ? 0 : 1, rise: ease(u, 3.167, 3.542, E.oExpo), up });
  } else { R.brB.set(0, 0, 0, 0, 0); L(R.mModel, { o: 0 }); L(R.mName, { o: 0 }); }

  /* ===== HUD furniture 4.375-8.292: mid scrim, title block, ticker ===== */
  const hudOut = ease(t, HUD_OUT, HUD_END, E.iCub);
  if (on(u, 4.667, 99) && on(t, 0, HUD_END)) {
    // 0.80 gradient; lighter (x0.775 = 0.62) over B4 so the car reads under the readout, full from the B5 cut
    st(R.midScrim, { o: P(u, 4.667, 4.875) * (1 - hudOut) * (on(t, 0, 5.833) ? .775 : 1) });
  } else hide(R.midScrim);
  if (on(u, 4.792, 99) && on(t, 0, HUD_END)) {
    const pe = ease(u, 4.792, 5.250, E.oCub);
    st(R.title, { ty: 30 * (1 - pe), o: pe * (1 - hudOut) });
    const pb = ease(u, 5.000, 5.250, E.oCub);
    R.titleBr.set(54, 1238, 907, 1421, pb > 0 ? 1 : 0, pb);
    const pw = ease(u, 4.792, 5.125, E.oCub);
    st(R.ticker, { o: 1 - hudOut, clip: pw >= 1 ? 'none' : `inset(0 ${(100 * (1 - pw)).toFixed(3)}% 0 0)` });
    const loop = R.tickerLoop, trav = 60 * (u - 4.792);
    const x = 54 - (((trav % loop) + loop) % loop);
    R.tickerRun.style.transform = `translateX(${x.toFixed(2)}px)`;
  } else { hide(R.title); hide(R.ticker); }

  /* ===== B4 RENTAL FLASH WINDOW readout 4.500-6.250; the fill lands on the B5 cut (5.833) ===== */
  if (on(u, 4.792, 6.542)) {
    const ex = ease(u, 6.417, 6.542, E.iCub);
    st(R.ro, { tx: -40 * ex, o: 1 - ex });
    const ph = ease(u, 4.792, 5.125, E.oCub);
    L(R.roHead, { o: ph, ty: 16 * (1 - ph) });
    st(R.roStripe, { clip: stripeReveal(R.roStripe, ease(u, 4.875, 5.375, E.oCub), 'lr'), o: u < 4.875 ? 0 : 1 });
    const ptk = ease(u, 4.917, 5.208, E.oCub);
    st(R.track, { sx: ptk, o: ptk > 0 ? 1 : 0 });
    const pf = ease(u, 5.208, 6.125, E.ioCub);
    st(R.fill, { sx: pf, o: pf > 0 ? 1 : 0 });
    const trackW = X(.80) - x0;
    const dotO = u < 5.208 ? 0 : 1 - P(u, 6.125, 6.208);
    st(R.dot, { tx: pf * trackW, o: dotO, s: 1 - .4 * P(u, 6.125, 6.208) });
    if (on(u, 6.125, 6.475)) {
      const pp = ease(u, 6.125, 6.475, E.oCub);
      st(R.pulse, { s: lerp(1, 64 / 24, pp), o: .8 * (1 - pp) });
    } else hide(R.pulse);
    const p11 = P(u, 5.000, 5.250);
    L(R.l11, { o: p11 > 0 ? Math.min(1, p11 * 1.6) : 0, s: lerp(.9, 1, E.oBack(p11)) });
    const p1 = P(u, 5.083, 5.333);
    const bump = on(u, 6.125, 6.375) ? Math.sin(Math.PI * P(u, 6.125, 6.375)) * .08 : 0;
    const originR = `${R.l1.padX + R.l1.vis}px ${R.l1.padT + R.l1.capH / 2}px`;
    L(R.l1, { o: p1 > 0 ? Math.min(1, p1 * 1.6) : 0, s: lerp(.9, 1, E.oBack(p1)) + bump, origin: originR,
              color: rgb(WHITE, GOLD, P(u, 6.125, 6.208)) });
  } else hide(R.ro);

  /* ===== B5 + B7 REQUIREMENTS 6.292-8.292 (build at u, HUD OUT in real time) ===== */
  if (on(u, 6.583, 99) && on(t, 0, HUD_END)) {
    R.rq.style.display = '';
    const ph = ease(u, 6.583, 6.875, E.oCub), hx = 1 - ease(t, HUD_OUT + .042, HUD_OUT + .167, E.iCub);
    L(R.rqHead, { o: ph * hx, ty: 16 * (1 - ph) });
    st(R.rqStripe, { clip: stripeReveal(R.rqStripe, ease(u, 6.625, 7.083, E.oCub), 'lr'), o: (u < 6.625 ? 0 : 1) * hx });
    const x1 = X(.80);
    const out = ease(t, HUD_OUT + .042, HUD_END, E.iCub);
    R.rows.forEach((rw, i) => {
      const s = 6.708 + .167 * i;
      if (!on(t, HUD_OUT + .042, 99)) {
        // reveal
        const ps = ease(u, s, s + .25, E.ioQuad), scanX = lerp(x0, x1, ps);
        L(rw.lab, { o: u < s ? 0 : 1, clipR: clamp((scanX - rw.lab.left) / rw.lab.vis, 0, 1) });
        L(rw.idx, { o: P(u, s, s + .1) });
        const so = u < s ? 0 : 1 - P(u, s + .25, s + .33);
        st(rw.scan, { sx: Math.max(ps, .001), o: so });
        const pp = P(u, s + .25, s + .45);
        st(rw.pip, { s: pp > 0 ? Math.max(0, E.oBack(pp)) : 0, o: pp > 0 ? 1 : 0 });
      } else {
        // HUD OUT: clip left->right with a leading gold scan
        L(rw.lab, { clipL: out });
        L(rw.idx, { o: 1 - out });
        st(rw.pip, { o: 1 - out });
        const lead = rw.lab.left + out * rw.lab.vis;
        st(rw.scan, { sx: Math.max(.001, (lead - x0) / (x1 - x0)), o: out < 1 ? 1 - out * .6 : 0 });
      }
    });
  } else hide(R.rq);

  /* ===== transit scan lines ===== */
  scanSet(R.scan1, t, 1.792, 1.875);
  scanSet(R.scan2, t, 9.917, T_B8);

  /* ===== B8 THE ASK 10.125-13.042: entry at v = t + 21 frames, exit 12.583-12.750 ===== */
  if (on(v, 11.042, 99) && on(t, 0, ASK_END)) {
    const ex = ease(t, ASK_OUT, ASK_END, E.iCub), exO = 1 - ex, exT = 12 * ex;
    L(R.ask1, { rise: ease(v, 11.042, 11.458, E.oExpo), o: exO, ty: exT });
    const p2 = ease(v, 11.250, 11.583, E.oCub);
    L(R.ask2, { o: p2 * exO, ty: 16 * (1 - p2) + exT });
    const p3 = ease(v, 11.333, 11.667, E.oCub);
    L(R.ask3, { o: p3 * exO, ty: 16 * (1 - p3) + exT });
    st(R.askS, { clip: stripeReveal(R.askS, ease(v, 11.417, 11.792, E.oCub), 'lr'), o: (v < 11.417 ? 0 : 1) * exO });
  } else { L(R.ask1, { o: 0 }); L(R.ask2, { o: 0 }); L(R.ask3, { o: 0 }); hide(R.askS); }
  /* soft lock brackets: fly in, track the car (right edge = measured nose + 2%), release before the text exits */
  const BR_OUT = 12.208, BR_END = 12.375;
  if (on(v, 11.208, 99) && on(t, 0, BR_END)) {
    const tl = X(.05), tr = X(Math.min(.955, noseAt(t) + .02)), tt = Y(.395), tb = Y(.595);
    const pl = ease(v, 11.208, 11.583, E.oExpo);
    const rel = ease(t, BR_OUT, BR_END, E.oCub), d = -20 * rel;
    R.brC.set(lerp(X(.035), tl, pl) + d, lerp(Y(.15), tt, pl) + d, lerp(X(.965), tr, pl) - d, lerp(Y(.80), tb, pl) - d,
              Math.min(1, P(v, 11.208, 11.292)) * (1 - rel));
  } else R.brC.set(0, 0, 0, 0, 0);

  /* ===== B9 END CARD 13.042-15.500 ===== */
  if (on(t, T_B9, 99)) {
    R.end.style.display = '';
    const pl = ease(t, T_B9, T_B9 + .417, E.oCub);
    st(R.logo, { o: pl, s: lerp(.96, 1, pl) });
    const ps = ease(t, T_B9 + .167, T_B9 + .542, E.ioCub);
    st(R.endS, { clip: stripeReveal(R.endS, ps, 'center'), o: ps > 0 ? 1 : 0 });
    const pk = ease(t, T_B9 + .208, T_B9 + .458, E.oCub);
    L(R.endK, { o: pk, ty: 12 * (1 - pk) });
    L(R.endH, { rise: ease(t, T_B9 + .250, T_B9 + .583, E.oExpo), o: t < T_B9 + .250 ? 0 : 1 });
    R.endC.forEach((ln, i) => {
      const a0 = T_B9 + .333 + .042 * i;
      const p = ease(t, a0, a0 + .250, E.oCub);
      L(ln, { o: p, ty: 14 * (1 - p) });
    });
  } else hide(R.end);
}

window.storyReady = (async () => {
  await Promise.all([document.fonts.load('100px SEBebas', 'ÁH'), document.fonts.load('100px SEMichroma', 'H')]);
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode ? i.decode().catch(() => {}) : 0));
  build();
  await Promise.all([...document.images].map(i => i.decode ? i.decode().catch(() => {}) : 0));
  renderAt(0);
  return true;
})();
window.renderAt = renderAt;
})();
</script>
