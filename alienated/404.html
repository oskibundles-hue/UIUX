<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dead Air — 404 · ALIENATED</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0a0a0b;--bone:#e9e5d9;--bone-dim:#a8a49a;--acc:#3fe07a;--line:rgba(233,229,217,.18)}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--ink);color:var(--bone);font-family:"Space Mono",monospace;
    display:grid;place-items:center;text-align:center;padding:24px;overflow:hidden}
  .wrap{position:relative;max-width:620px}
  .eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--acc);margin-bottom:22px}
  h1{font-family:"Anton",sans-serif;font-weight:400;text-transform:uppercase;line-height:.9;
    font-size:clamp(72px,18vw,180px);letter-spacing:.01em;
    background:linear-gradient(180deg,#fff,#9a9aa2 60%,#cfcfd6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .code{font-family:"Anton",sans-serif;font-size:clamp(30px,6vw,56px);color:var(--bone-dim);letter-spacing:.06em;margin-top:6px}
  p{color:var(--bone-dim);max-width:42ch;margin:22px auto 30px;line-height:1.7;font-size:14px;letter-spacing:.02em}
  a.btn{display:inline-block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;
    color:#04140a;background:var(--acc);padding:14px 26px;transition:filter .2s}
  a.btn:hover{filter:brightness(1.1)}
  .static{position:fixed;inset:0;pointer-events:none;opacity:.04;
    background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
</style>
</head>
<body>
  <div class="static"></div>
  <div class="wrap">
    <div class="eyebrow">Error 404 · No Signal</div>
    <h1>Dead Air</h1>
    <div class="code">This line is dead.</div>
    <p>The page you tried to reach left no message. Static where a signal should be — head back and try the collection.</p>
    <a class="btn" href="/">← Return to ALIENATED</a>
  </div>
</body>
</html>
