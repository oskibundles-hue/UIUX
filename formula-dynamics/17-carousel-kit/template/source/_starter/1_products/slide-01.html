<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<!-- STARTER slide 1 of 3: full-bleed hero. Copy this folder to source/<date>/<slot>/, then replace every [[...]]
     and the placeholder photo. lint.py fails while any [[ or the placeholder is left. -->
<style>
.photo{height:1350px}
.photo img{--y:62%;--zoom:1.06;--oy:70%}   /* crop: --x/--y move the frame, --zoom pushes in, --ox/--oy pick the zoom centre */
.photo .shade{background:linear-gradient(180deg,rgba(8,8,10,.92) 0%,rgba(8,8,10,.55) 26%,rgba(8,8,10,0) 40%,rgba(8,8,10,0) 70%,rgba(8,8,10,.85) 86%,#08080A 100%)}
.top{position:absolute;left:var(--sx);right:var(--sx);top:150px;z-index:4}
.top .kicker{margin-top:22px}
.top .display{font-size:150px;margin-top:14px}
.top .display .red{color:var(--red)}
.bot{position:absolute;left:var(--sx);right:200px;bottom:var(--sy);z-index:4}
.bot .body{font-size:40px}
.bot .tag{margin-top:22px}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/_placeholder.jpg" alt="[[what the photo shows]]"><div class="shade"></div></div>
  <div class="run"><span><b>[[CAMPAIGN LABEL]]</b> &nbsp;·&nbsp; [[DATES]]</span><span class="count">01<i> / 03</i></span></div>
  <div class="top">
    <div class="rule"></div>
    <div class="kicker">[[Part · car it fits]]</div>
    <div class="display"><span class="red">[[$000]]</span> off<br>[[the thing]]</div>
  </div>
  <div class="bot">
    <div class="body"><b>[[20% off]]</b> [[one plain sentence on what it is and who it fits]]. Swipe to see [[what slide 2 proves]].</div>
    <div class="tag">Shown: [[car]] at the FD shop</div>
  </div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
