<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../day.css"><link rel="stylesheet" href="../../bf.css">
<style>
.days{position:absolute;left:var(--sx);right:var(--sx);top:170px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.d{border:3px solid var(--line);padding:20px 20px 18px;height:430px;display:flex;flex-direction:column;justify-content:space-between}
.d .m{font-family:"Plex";font-size:26px;letter-spacing:.06em;color:var(--grey)}
.d .n{font-family:"Bebas";font-size:290px;line-height:.78;color:var(--sub)}
.d .s{font-family:"Plex";font-weight:700;font-size:26px;letter-spacing:.06em;color:var(--grey);min-height:30px}
.d.on{border-color:var(--red);background:var(--red)}
.d.on .m,.d.on .s,.d.on .n{color:var(--white)}
.d.end{border-color:var(--white)}
.d.end .n,.d.end .s{color:var(--white)}
.track{position:absolute;left:var(--sx);right:var(--sx);top:640px}
.track .bar{height:10px;background:rgba(255,255,255,.12);position:relative}
.track .bar i{position:absolute;left:0;top:0;bottom:0;width:25%;background:var(--red)}
.track .lab{display:flex;justify-content:space-between;font-family:"Plex";font-size:26px;color:var(--sub);margin-top:14px;letter-spacing:.04em}
.head{position:absolute;left:var(--sx);right:var(--sx);top:790px}
.head .display{font-size:176px}
.head .body{margin-top:22px;max-width:900px}
/* bf-nudge */.bf .days{top:192px}</style></head><body>
<div class="slide bf"><div class="bfb"><b>BLACK FRIDAY SALE</b><span>ENDS DEC 4 &nbsp;·&nbsp; 01<i> / 03</i></span></div>
  <div class="run"><span><b>REMINDER</b> &nbsp;·&nbsp; SALE ENDS DEC 4</span><span class="count">01<i> / 03</i></span></div>
  <div class="days">
    <div class="d on"><div class="m">DEC</div><div class="n">1</div><div class="s">TODAY</div></div>
    <div class="d"><div class="m">DEC</div><div class="n">2</div><div class="s"></div></div>
    <div class="d"><div class="m">DEC</div><div class="n">3</div><div class="s"></div></div>
    <div class="d end"><div class="m">DEC</div><div class="n">4</div><div class="s">LAST DAY</div></div>
  </div>
  <div class="track"><div class="bar"><i></i></div><div class="lab"><span>DAY 1 OF 4</span><span>SALE PRICES END</span></div></div>
  <div class="head">
    <div class="display">Four days left</div>
    <div class="body">Sale prices run <b>through Dec 4</b>. Swipe for a Ghibli order you can plan today.</div>
  </div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
