<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../day.css">
<style>
.photo{height:700px}
.photo img{--x:30%;--y:62%;--zoom:1.7;--ox:30%;--oy:62%}
.photo .shade{background:linear-gradient(180deg,rgba(8,8,10,.92) 0%,rgba(8,8,10,.55) 11%,rgba(8,8,10,0) 22%,rgba(8,8,10,0) 70%,#08080A 100%)}
.mid{position:absolute;left:var(--sx);right:var(--sx);top:700px;z-index:4}
.mid .kicker{margin-top:22px;font-size:32px}
.mid .display{font-size:150px;margin-top:14px}
.mid .display .red{color:var(--red)}
.bot{position:absolute;left:var(--sx);right:200px;bottom:var(--sy);z-index:4}
.bot .tag{margin-top:20px}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/f430spider_wheel_caliper.jpg" alt="Red Ferrari F430 Spider front wheel and red brake caliper at the FD shop"><div class="shade"></div></div>
  <div class="run"><span><b>PRODUCT SPOTLIGHT</b> &nbsp;·&nbsp; BREMBO FOR THE F430</span><span class="count">01<i> / 03</i></span></div>
  <div class="mid">
    <div class="rule"></div>
    <div class="kicker">Brembo GT|S big brake kit · Ferrari F430 · 5% off</div>
    <div class="display">Front, rear,<br>or <span class="red">both?</span></div>
  </div>
  <div class="bot">
    <div class="body"><b>One listing, three ways to buy.</b> Swipe for the price of each.</div>
    <div class="tag">Shown: F430 Spider on its current brakes at the FD shop</div>
  </div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
