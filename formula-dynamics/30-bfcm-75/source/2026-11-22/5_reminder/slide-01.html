<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
/* car up on the lift: the moment the parts change hands */
.photo{height:1350px}
.photo img{--y:46%;--zoom:1}
.photo .shade{background:linear-gradient(180deg,rgba(8,8,10,.97) 0%,rgba(8,8,10,.9) 28%,rgba(8,8,10,.35) 38%,rgba(8,8,10,0) 46%,rgba(8,8,10,0) 76%,rgba(8,8,10,.88) 88%,#08080A 100%)}
.top{position:absolute;left:var(--sx);right:var(--sx);top:150px;z-index:4}
.top .kicker{margin-top:22px}
.top .display{font-size:116px;margin-top:12px}
.top .display .red{color:var(--red)}
.bot{position:absolute;left:var(--sx);right:200px;bottom:var(--sy);z-index:4}
.bot .body{font-size:38px}
.bot .tag{margin-top:20px}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/mclaren_lift_underside.jpg" alt="Blue McLaren raised on a lift in the FD shop, seen from below"><div class="shade"></div></div>
  <div class="run"><span><b>SALE REMINDER</b> &nbsp;·&nbsp; ENDS DEC 4</span><span class="count">01<i> / 03</i></span></div>
  <div class="top">
    <div class="rule"></div>
    <div class="kicker">Before it goes up on the lift</div>
    <div class="display">Bought the parts?<br><span class="red">Brief the garage.</span></div>
  </div>
  <div class="bot">
    <div class="body">One quick check with your installer <b>keeps duplicate parts off the invoice.</b></div>
    <div class="tag">Shown: McLaren at the FD shop</div>
  </div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
