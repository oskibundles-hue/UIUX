<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
/* macro hero: the 4200 grille and trident in B&W, headline asks the one question that picks the variant */
.photo{height:1350px}
.photo img{--x:50%;--y:30%;--zoom:1}
.photo .shade{background:linear-gradient(180deg,rgba(8,8,10,.95) 0%,rgba(8,8,10,.75) 30%,rgba(8,8,10,.1) 50%,rgba(8,8,10,0) 60%,rgba(8,8,10,.2) 79%,rgba(8,8,10,.93) 86%)}
.top{position:absolute;left:var(--sx);right:var(--sx);top:150px;z-index:4}
.top .kicker{margin-top:22px}
.top .display{font-size:142px;margin-top:14px}
.top .display .red{color:var(--red)}
.bot{position:absolute;left:var(--sx);right:200px;bottom:var(--sy);z-index:4}
.bot .body{font-size:40px}
.bot .tag{margin-top:22px}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/m4200_grille_trident_bw_clip07.jpg" alt="Maserati 4200 front grille and trident, black and white, FD shop"><div class="shade"></div></div>
  <div class="run"><span><b>LARINI EXHAUST</b> &nbsp;·&nbsp; MASERATI 4200</span><span class="count">01<i> / 03</i></span></div>
  <div class="top">
    <div class="rule"></div>
    <div class="kicker">Larini sport mufflers · 4200 / GranSport</div>
    <div class="display">Does your 4200<br>have a <span class="red">valve?</span></div>
  </div>
  <div class="bot">
    <div class="body">Larini lists its 4200 sport muffler three ways. <b>Your answer picks yours.</b> 10% off through Dec 4.</div>
    <div class="tag">Shown: Maserati 4200 at the FD shop</div>
  </div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
