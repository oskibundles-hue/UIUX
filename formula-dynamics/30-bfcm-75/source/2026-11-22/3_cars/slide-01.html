<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
/* 812 nose with a ring on the bonnet: the 6.5L engine sits behind it, which is where an oil change kit goes to work */
.photo{height:1350px}
.photo img{--x:50%;--y:60%;--zoom:1}
.photo .shade{background:linear-gradient(180deg,rgba(8,8,10,.92) 0%,rgba(8,8,10,.7) 26%,rgba(8,8,10,0) 42%,rgba(8,8,10,0) 66%,rgba(8,8,10,.55) 80%,rgba(8,8,10,.95) 92%)}
.top{position:absolute;left:var(--sx);right:var(--sx);top:150px;z-index:4}
.top .kicker{margin-top:22px}
.top .display{font-size:128px;margin-top:14px}
.top .display .red{color:var(--red)}
.ring{position:absolute;left:var(--cx);top:var(--cy);width:210px;height:210px;margin:-105px 0 0 -105px;border:5px solid var(--white);border-radius:50%;z-index:4;--cx:235px;--cy:650px;box-shadow:0 0 0 3px rgba(8,8,10,.55),inset 0 0 0 3px rgba(8,8,10,.55)}
.lead{position:absolute;left:233px;top:755px;width:4px;height:40px;background:var(--white);z-index:4}
.lbl{position:absolute;left:72px;top:795px;z-index:4;background:rgba(8,8,10,.88);border-left:6px solid var(--red);padding:14px 22px 12px;font-family:"Barlow";font-weight:700;font-size:36px;line-height:1.05;color:var(--white);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.bot{position:absolute;left:var(--sx);right:200px;bottom:var(--sy);z-index:4}
.bot .body{font-size:38px}
.bot .tag{margin-top:22px}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/812gts_front_bay.jpg" alt="Red Ferrari 812 GTS front end on the FD shop floor"><div class="shade"></div></div>
  <div class="run"><span><b>CARS WITH PARTS</b> &nbsp;·&nbsp; FERRARI 812</span><span class="count">01<i> / 03</i></span></div>
  <div class="top">
    <div class="rule"></div>
    <div class="kicker">Oil change kit · Ferrari 812</div>
    <div class="display">The service<br>starts <span class="red">under here.</span></div>
  </div>
  <div class="ring"></div><div class="lead"></div>
  <div class="lbl">6.5L engine sits under this bonnet</div>
  <div class="bot">
    <div class="body">One kit for the 812's oil service, <b>filter included, now on sale through Dec 4.</b></div>
    <div class="tag">Shown: Ferrari 812 GTS at the FD shop</div>
  </div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
