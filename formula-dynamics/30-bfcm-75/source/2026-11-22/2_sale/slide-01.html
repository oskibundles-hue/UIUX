<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
/* full-bleed rear three-quarter, headline over the dark shop wall */
.photo{height:1350px}
.photo img{--y:6%;--zoom:1}
.photo .shade{background:linear-gradient(180deg,rgba(8,8,10,.94) 0%,rgba(8,8,10,.7) 24%,rgba(8,8,10,0) 38%,rgba(8,8,10,0) 66%,rgba(8,8,10,.8) 80%,#08080A 94%)}
.top{position:absolute;left:var(--sx);right:var(--sx);top:150px;z-index:4}
.top .kicker{margin-top:22px}
.top .display{font-size:120px;margin-top:14px}
.top .display .red{color:var(--red)}
.bot{position:absolute;left:var(--sx);right:200px;bottom:var(--sy);z-index:4}
.bot .body{font-size:40px}
.bot .tag{margin-top:22px}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/granturismo_rear34_diffuser.jpg" alt="White Maserati GranTurismo rear three-quarter with the diffuser, in the FD shop"><div class="shade"></div></div>
  <div class="run"><span><b>FORMULA DYNAMICS SALE</b> &nbsp;·&nbsp; NOV 20 – DEC 4</span><span class="count">01<i> / 03</i></span></div>
  <div class="top">
    <div class="rule"></div>
    <div class="kicker">Larini exhaust · GranTurismo 2008–2019</div>
    <div class="display">Budget your exhaust<br><span class="red">by the section</span></div>
  </div>
  <div class="bot">
    <div class="body">Larini sells the GranTurismo system in pieces, and <b>every piece is 10% off through Dec 4.</b> Swipe for what each step costs.</div>
    <div class="tag">Shown: GranTurismo at the FD shop</div>
  </div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
