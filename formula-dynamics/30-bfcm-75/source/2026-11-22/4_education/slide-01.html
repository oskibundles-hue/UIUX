<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
/* tech over an open Huracán V10 bay; the care rule is the headline */
.photo{height:1350px}
.photo img{--y:62%;--zoom:1}
.photo .shade{background:linear-gradient(180deg,rgba(8,8,10,.96) 0%,rgba(8,8,10,.88) 30%,rgba(8,8,10,.3) 42%,rgba(8,8,10,0) 50%,rgba(8,8,10,0) 76%,rgba(8,8,10,.86) 88%,#08080A 100%)}
.top{position:absolute;left:var(--sx);right:var(--sx);top:150px;z-index:4}
.top .kicker{margin-top:22px}
.top .display{font-size:128px;margin-top:12px}
.top .display .red{color:var(--red)}
.bot{position:absolute;left:var(--sx);right:200px;bottom:var(--sy);z-index:4}
.bot .body{font-size:38px}
.bot .tag{margin-top:20px}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/huracan_engine_bay_tech.jpg" alt="FD technician working over the open engine bay of a white Lamborghini Huracán"><div class="shade"></div></div>
  <div class="run"><span><b>AIR FILTER CARE</b> &nbsp;·&nbsp; BMC</span><span class="count">01<i> / 03</i></span></div>
  <div class="top">
    <div class="rule"></div>
    <div class="kicker">The reusable filter</div>
    <div class="display">Clean it. Oil it.<br><span class="red">Run it again.</span></div>
  </div>
  <div class="bot">
    <div class="body">A BMC filter is <b>washable and reusable</b>, so it isn't thrown away at service time.</div>
    <div class="tag">Shown: Huracán at the FD shop</div>
  </div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
