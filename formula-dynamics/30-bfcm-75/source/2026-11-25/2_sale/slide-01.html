<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../day.css">
<style>
.photo{height:1350px}
.photo img{--y:55%;filter:brightness(1.6) contrast(1.05)}
.photo .shade{background:linear-gradient(180deg,rgba(8,8,10,.95) 0%,rgba(8,8,10,.82) 34%,rgba(8,8,10,.15) 52%,rgba(8,8,10,0) 64%,rgba(8,8,10,.85) 82%,#08080A 100%)}
.top{position:absolute;left:var(--sx);right:var(--sx);top:150px;z-index:4}
.top .kicker{margin-top:22px}
.top .display{font-size:150px;margin-top:14px}
.top .display .red{color:var(--red)}
.bot{position:absolute;left:var(--sx);right:200px;bottom:var(--sy);z-index:4}
.bot .body{font-size:40px}
.bot .tag{margin-top:22px}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/m4200_nose_clip06.jpg" alt="Black Maserati 4200 nose and grille on the FD shop floor"><div class="shade"></div></div>
  <div class="run"><span><b>SALE GUIDE</b> &nbsp;·&nbsp; THE 15% TIER</span><span class="count">01<i> / 03</i></span></div>
  <div class="top">
    <div class="rule"></div>
    <div class="kicker">FD drive-by-wire modules</div>
    <div class="display"><span class="red">15% off</span><br>every one</div>
  </div>
  <div class="bot">
    <div class="body"><b>Nine listings, three prices.</b> Swipe to find your car's row, then check one detail before you order.</div>
    <div class="tag">Shown: Maserati 4200 at the FD shop</div>
  </div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
