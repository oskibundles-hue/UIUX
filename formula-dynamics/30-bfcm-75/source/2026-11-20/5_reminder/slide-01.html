<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
.photo{height:1350px}
.photo img{--y:30%}
.photo .shade{background:linear-gradient(180deg,rgba(8,8,10,.92) 0%,rgba(8,8,10,.5) 12%,rgba(8,8,10,0) 22%,rgba(8,8,10,0) 44%,rgba(8,8,10,.86) 58%,rgba(8,8,10,.97) 68%,#08080A 100%)}
.bot{position:absolute;left:var(--sx);right:var(--sx);bottom:var(--sy);z-index:4}
.bot .kicker{margin-top:22px}
.bot .display{font-size:128px;margin-top:10px}
.bot .display .red{color:var(--red)}
.bot .body{font-size:38px;margin-top:20px;max-width:780px}
.bot .tag{margin-top:24px}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/store_tips_shelf.jpg" alt="Exhaust tips on a lit shelf in the FD showroom"><div class="shade"></div></div>
  <div class="run"><span><b>EVENING REMINDER</b> &nbsp;·&nbsp; SAVE THE LINK</span><span class="count">01<i> / 03</i></span></div>
  <div class="bot">
    <div class="rule"></div>
    <div class="kicker">Before you close the app tonight</div>
    <div class="display">Save the link<br><span class="red">that names your car</span></div>
    <div class="body">Not a screenshot. <b>The page that names your model.</b> The sale runs through Dec 4.</div>
    <div class="tag">Shown: exhaust tips on the FD showroom shelf</div>
  </div>
  <div class="mark icon" style="bottom:auto;top:140px"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
