<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
.photo{height:1350px}
.photo img{--y:100%}
.photo .shade{background:linear-gradient(180deg,rgba(8,8,10,.95) 0%,rgba(8,8,10,.88) 30%,rgba(8,8,10,.35) 44%,rgba(8,8,10,0) 52%,rgba(8,8,10,0) 84%,rgba(8,8,10,.75) 93%,#08080A 100%),
  linear-gradient(90deg,rgba(8,8,10,.7) 0%,rgba(8,8,10,.35) 30%,rgba(8,8,10,0) 48%)}
.top{position:absolute;left:var(--sx);right:var(--sx);top:150px;z-index:4}
.top .kicker{margin-top:22px}
.top .display{font-size:150px;margin-top:12px}
.top .display .red{color:var(--red)}
/* ring on the fender lip over the tyre: slide px */
.ring{position:absolute;left:var(--cx);top:var(--cy);width:200px;height:200px;margin:-100px 0 0 -100px;border:4px solid var(--red);border-radius:50%;z-index:4;--cx:930px;--cy:735px}
.lab{position:absolute;right:250px;top:578px;z-index:4;background:var(--red);color:var(--white);font-family:"Barlow";font-weight:700;font-size:32px;letter-spacing:.04em;padding:8px 16px;text-transform:uppercase}
.side{position:absolute;left:var(--sx);width:430px;top:930px;z-index:4}
.side .body{font-size:36px}
.bot{position:absolute;left:var(--sx);right:200px;bottom:var(--sy);z-index:4}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/f8spider_rearwheel_gap.jpg" alt="Blue Ferrari F8 Spider rear wheel and fender, FD shop"><div class="shade"></div></div>
  <div class="run"><span><b>CARS WITH PARTS</b> &nbsp;·&nbsp; FERRARI F8</span><span class="count">01<i> / 03</i></span></div>
  <div class="top">
    <div class="rule"></div>
    <div class="kicker">Wheel spacers · Ferrari F8</div>
    <div class="display">Look at the lip,<br><span class="red">not the height</span></div>
  </div>
  <div class="ring"></div>
  <div class="lab">Wheel to fender lip</div>
  <div class="side"><div class="body">Spacers move the wheel <b>out toward the fender lip</b>. They don't change ride height.</div></div>
  <div class="bot"><div class="tag">Shown: F8 Spider at the FD shop</div></div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
