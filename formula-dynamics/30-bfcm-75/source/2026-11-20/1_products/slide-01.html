<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
.photo{height:1350px}
.photo img{--y:62%;--zoom:1.06;--oy:70%}
.photo .shade{background:linear-gradient(180deg,rgba(8,8,10,.92) 0%,rgba(8,8,10,.55) 26%,rgba(8,8,10,0) 40%,rgba(8,8,10,0) 70%,rgba(8,8,10,.85) 86%,#08080A 100%)}
.top{position:absolute;left:var(--sx);right:var(--sx);top:150px;z-index:4}
.top .kicker{margin-top:22px}
.top .display{font-size:150px;margin-top:14px}
.top .display .fig{font-family:"Bebas";color:var(--white)}
.top .display .red{color:var(--red)}
.bot{position:absolute;left:var(--sx);right:200px;bottom:var(--sy);z-index:4}
.bot .body{font-size:40px}
.bot .tag{margin-top:22px}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/f8spider_rear34_shop.jpg" alt="Blue Ferrari F8 Spider, rear three-quarter, FD shop floor"><div class="shade"></div></div>
  <div class="run"><span><b>FORMULA DYNAMICS SALE</b> &nbsp;·&nbsp; NOV 20 – DEC 4</span><span class="count">01<i> / 03</i></span></div>
  <div class="top">
    <div class="rule"></div>
    <div class="kicker">ECU tune · Ferrari F8 Tributo / Spider</div>
    <div class="display"><span class="red">$859.80</span> off<br>the stage 1 tune</div>
  </div>
  <div class="bot">
    <div class="body"><b>20% off</b> the F8 Stage 1 ECU tune, through Dec 4. Swipe to see which stage fits your car.</div>
    <div class="tag">Shown: F8 Spider at the FD shop</div>
  </div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
