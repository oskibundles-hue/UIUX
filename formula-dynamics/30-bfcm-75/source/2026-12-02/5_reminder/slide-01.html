<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../day.css">
<style>
/* photo-top + countdown block */
.photo{height:720px}
.photo img{--x:50%;--y:40%;--zoom:1.0}
.photo .shade{background:linear-gradient(180deg,rgba(8,8,10,.8) 0px,rgba(8,8,10,.62) 130px,rgba(8,8,10,0) 250px,rgba(8,8,10,0) 520px,#08080A 720px)}
.cd{position:absolute;left:var(--sx);right:var(--sx);top:640px;z-index:4;display:grid;grid-template-columns:auto 1fr;column-gap:36px;align-items:end}
.cd .n{font-family:"Bebas";font-size:330px;line-height:.78;color:var(--red)}
.cd .w{font-family:"Bebas";font-size:96px;line-height:.9;color:var(--white);padding-bottom:8px}
.cd .w span{display:block;font-family:"Plex";font-size:24px;letter-spacing:.06em;color:var(--sub);margin-top:10px}
.mid{position:absolute;left:var(--sx);right:var(--sx);top:930px}
.mid .display{font-size:84px}
.bot{position:absolute;left:var(--sx);right:200px;bottom:var(--sy);z-index:4}
.bot .body{font-size:36px}
.bot .tag{margin-top:18px}
.run,.run b{color:#fff}.run .count i{color:#d8d8de}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/bmw_m2_carbon_fender.jpg" alt="Carbon fiber hood and front fender on a BMW M2 at the FD shop"><div class="shade"></div></div>
  <div class="run"><span><b>SALE REMINDER</b> &nbsp;·&nbsp; ENDS DEC 4</span><span class="count">01<i> / 03</i></span></div>
  <div class="cd"><div class="n">3</div><div class="w">days left<span>DEC 2, 3 AND 4, 2026</span></div></div>
  <div class="mid"><div class="display">Carbon can wait.<br>The sale can't.</div></div>
  <div class="bot">
    <div class="body">Planning carbon for your car? Order the sale parts first. Swipe for why.</div>
    <div class="tag">Shown: carbon hood and fender, BMW M2 at the FD shop</div>
  </div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
