<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../day.css">
<style>
.disc{position:absolute;left:300px;top:150px;width:700px;height:700px;border-radius:50%;overflow:hidden;background:#e9e9eb;box-shadow:0 0 0 3px var(--red),0 30px 80px rgba(0,0,0,.6)}
.disc img{position:absolute;width:1080px;left:-199px;top:-487px}

<div class="slide">
  <div class="disc"><img src="../../../assets/photos/spacer22_studs_studio.jpg" alt="Formula Dynamics 22 mm wheel spacer with studs"></div>

</div></body></html>
