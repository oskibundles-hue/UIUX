<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../day.css">
<style>
.card{position:absolute;left:0;top:0;width:1080px;height:800px;background:#fff;overflow:hidden}
.card img{position:absolute;left:50%;top:150px;height:630px;transform:translateX(-50%)}
.run{color:#55555c}.run b,.run .count{color:#08080A}.run .count i{color:#8a8a92}
.head{position:absolute;left:var(--sx);right:var(--sx);top:840px}
.head .kicker{margin-top:20px}
.head .display{font-size:112px;margin-top:12px}
.head .display .red{color:var(--red)}
.bot{position:absolute;left:var(--sx);right:200px;bottom:var(--sy)}
.bot .body{font-size:36px}
.bot .tag{margin-top:18px}
</style></head><body>
<div class="slide">
  <div class="card"><img src="../../../assets/photos/vcwheel_maserati_listing.jpg" alt="Veloce Corsa wheel, store listing photo, Maserati centre cap"></div>
  <div class="run"><span><b>PRODUCT SPOTLIGHT</b> &nbsp;·&nbsp; VELOCE CORSA</span><span class="count">01<i> / 03</i></span></div>
  <div class="head">
    <div class="rule"></div>
    <div class="kicker">Veloce Corsa wheels · Maserati</div>
    <div class="display">Size sets the price.<br><span class="red">Standard finish is free.</span></div>
  </div>
  <div class="bot">
    <div class="body"><b>5% off through Dec 4.</b> Ghibli, Quattroporte (2014 on) and Levante. Swipe for your size.</div>
    <div class="tag">Shown: store listing photo</div>
  </div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
