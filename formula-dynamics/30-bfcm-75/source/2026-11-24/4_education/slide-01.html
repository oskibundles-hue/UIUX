<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
/* split: the question on the left, the part standing in a white studio on the right */
.photo{left:auto;right:0;width:500px;height:1350px}
.photo img{--x:80%;--y:50%;--zoom:1.0}
.photo .shade{background:linear-gradient(90deg,rgba(8,8,10,.35) 0%,rgba(8,8,10,0) 14%)}
.run{right:var(--sx)}
.run .count{color:var(--ink)}
.run .count i{color:#55555C}
.left{position:absolute;left:var(--sx);width:470px;top:330px}
.left .kicker{margin-top:22px}
.left .display{font-size:124px;margin-top:12px}
.left .display .red{color:var(--red)}
.left .body{margin-top:30px;font-size:36px}
.tag{position:absolute;left:var(--sx);bottom:var(--sy);width:440px}
.mark.icon{left:var(--sx);right:auto;bottom:150px}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/kw_v3_ghibli_listing.jpg" alt="KW V3 coilover kit: springs, dampers, tool kit on white"><div class="shade"></div></div>
  <div class="run"><span><b>FITMENT 101</b></span><span class="count">01<i> / 03</i></span></div>
  <div class="left">
    <div class="rule"></div>
    <div class="kicker">Before you add to cart</div>
    <div class="display">Will it<br>fit <span class="red">your</span><br>car?</div>
    <div class="body">The listing tells you. <b>Here is how to read it, line by line.</b></div>
  </div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
  <div class="tag">Shown: KW V3 coilovers, FD store listing photo</div>
</div></body></html>
