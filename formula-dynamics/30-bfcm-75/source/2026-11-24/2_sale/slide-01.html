<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
/* service bay photo on top, the idea set below it on black */
.photo{height:1000px}
.photo img{--y:58%}
.photo .shade{background:linear-gradient(180deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.75) 12%,rgba(0,0,0,0) 24%,rgba(8,8,10,0) 80%,#08080A 100%)}
.tag{position:absolute;left:var(--sx);top:900px;z-index:4;background:var(--ink);padding:10px 14px}
.low{position:absolute;left:var(--sx);right:var(--sx);top:990px;z-index:4}
.low .kicker{margin-top:18px}
.low .display{font-size:104px;margin-top:8px}
.low .display .red{color:var(--red)}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/supra_hoodup_service_lift.jpg" alt="Toyota Supra with the hood up in an FD service bay, technician beside it"><div class="shade"></div></div>
  <div class="run"><span><b>BLACK FRIDAY</b> &nbsp;·&nbsp; SERVICE SHEET</span><span class="count">01<i> / 03</i></span></div>
  <div class="tag">Shown: a Supra in for service at the FD shop</div>
  <div class="low">
    <div class="rule"></div>
    <div class="kicker">The work is due anyway</div>
    <div class="display">Shop the sale from your<br><span class="red">service sheet</span></div>
  </div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
