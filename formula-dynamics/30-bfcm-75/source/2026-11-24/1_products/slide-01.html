<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
/* studio shot on white seamless: dark editorial band on top, the kit standing in the light below */
.photo{top:430px;height:920px}
.photo img{--y:62%;--zoom:1.18;--oy:66%}
.photo .shade{background:linear-gradient(180deg,#08080A 0%,rgba(8,8,10,0) 14%,rgba(8,8,10,0) 78%,rgba(8,8,10,.55) 100%)}
.top{position:absolute;left:var(--sx);right:var(--sx);top:150px;z-index:4}
.top .kicker{margin-top:22px}
.top .display{font-size:132px;margin-top:12px}
.top .display .red{color:var(--red)}
.price{position:absolute;right:var(--sx);top:1012px;z-index:4;background:var(--ink);padding:20px 26px 18px;text-align:right}
.price .fig{font-family:"Bebas";font-size:112px;line-height:.85;color:var(--white)}
.price .lab{font-family:"Plex";font-size:22px;letter-spacing:.06em;color:var(--sub);margin-top:8px;text-transform:uppercase}
.tag{position:absolute;left:var(--sx);bottom:var(--sy);z-index:4;background:var(--ink);padding:10px 14px}
.mark.icon{z-index:6}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/oilkit_ghibli_studio.jpg" alt="FD oil change kit: OE Maserati filter, copper crush washer and quarts of 10W-60"><div class="shade"></div></div>
  <div class="run"><span><b>PRODUCT SPOTLIGHT</b> &nbsp;·&nbsp; MASERATI GHIBLI</span><span class="count">01<i> / 03</i></span></div>
  <div class="top">
    <div class="rule"></div>
    <div class="kicker">Oil change kit · Ghibli 2014 on</div>
    <div class="display">Your next Ghibli<br>oil change, <span class="red">one box</span></div>
  </div>
  <div class="price"><div class="fig">$269</div><div class="lab">2018+ 3.0L kit · listing price</div></div>
  <div class="tag">Shown: the FD Ghibli kit, 2018+ spec</div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
