<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
/* two cars nose to camera; the question sits on the dark wall above them */
.photo{height:1350px}
.photo img{--y:40%}
.photo .shade{background:linear-gradient(180deg,#08080A 0%,rgba(8,8,10,.86) 26%,rgba(8,8,10,.2) 44%,rgba(8,8,10,0) 56%,rgba(8,8,10,0) 84%,rgba(8,8,10,.8) 100%)}
.top{position:absolute;left:var(--sx);right:var(--sx);top:150px;z-index:4}
.top .kicker{margin-top:22px}
.top .display{font-size:124px;margin-top:12px}
.top .display .red{color:var(--red)}
.tag{position:absolute;left:var(--sx);bottom:var(--sy);z-index:4}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/two_ferraris_front_shop.jpg" alt="Two red Ferraris parked side by side in the FD shop"><div class="shade"></div></div>
  <div class="run"><span><b>REMINDER</b> &nbsp;·&nbsp; TWO CARS</span><span class="count">01<i> / 03</i></span></div>
  <div class="top">
    <div class="rule"></div>
    <div class="kicker">Sale runs through Dec 4</div>
    <div class="display">Two cars in the garage?<br>Shop for <span class="red">both</span></div>
  </div>
  <div class="tag">Shown: two Ferraris at the FD shop</div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
