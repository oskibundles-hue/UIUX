<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
/* full-bleed MC20 in the dark shop; the offer sits low on the wet floor */
.photo{height:1350px}
.photo img{--y:78%;--zoom:1.06;--ox:40%;--oy:40%}
.photo .shade{background:linear-gradient(180deg,rgba(8,8,10,.85) 0%,rgba(8,8,10,0) 16%,rgba(8,8,10,0) 50%,rgba(8,8,10,.82) 70%,#08080A 92%)}
.low{position:absolute;left:var(--sx);right:var(--sx);top:900px;z-index:4}
.low .kicker{margin-top:22px}
.low .display{font-size:128px;margin-top:10px}
.low .display .red{color:var(--red)}
.tag{position:absolute;left:var(--sx);bottom:var(--sy);z-index:4}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/mc20_front34_shop.jpg" alt="Matte black Maserati MC20 in the FD shop"><div class="shade"></div></div>
  <div class="run"><span><b>CAR OF THE DAY</b> &nbsp;·&nbsp; MASERATI MC20</span><span class="count">01<i> / 03</i></span></div>
  <div class="low">
    <div class="rule"></div>
    <div class="kicker">FD brake lines · made for the MC20</div>
    <div class="display">The MC20 lines are<br><span class="red">20% off</span> to Dec 4</div>
  </div>
  <div class="tag">Shown: MC20 at the FD shop</div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
