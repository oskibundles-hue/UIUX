<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
/* rear wheel macro (asset 2160x2700): box 1080x1010, object-position y 58%, zoom 1.9 about the caliper; one ring + one label */
.photo{height:1010px}
.photo img{--y:58%;--zoom:1.9;--ox:41.7%;--oy:57.6%}
.photo .shade{background:linear-gradient(180deg,rgba(8,8,10,.95) 0%,rgba(8,8,10,.55) 9%,rgba(8,8,10,0) 20%,rgba(8,8,10,0) 78%,#08080A 100%)}
.pin{position:absolute;left:var(--px);top:var(--py);z-index:4}
.pin .ring{position:absolute;width:var(--d);height:var(--d);left:calc(var(--d) / -2);top:calc(var(--d) / -2);border:5px solid var(--red);border-radius:50%}
.pin .lab{position:absolute;left:calc(var(--d) / 2 + 16px);top:-34px;width:330px;background:var(--ink);color:var(--white);font-family:"Plex";font-weight:700;font-size:28px;line-height:1.2;letter-spacing:.03em;padding:10px 14px;text-transform:uppercase}
.head{position:absolute;left:var(--sx);right:var(--sx);top:1030px}
.head .display{font-size:100px}
.body2{position:absolute;left:var(--sx);right:var(--sx);top:1150px;font-size:36px;line-height:1.25}
.fine{position:absolute;left:var(--sx);right:200px;bottom:var(--sy)}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/mc20_rearwheel_trailer.jpg" alt="MC20 rear wheel with the red caliper behind the spokes"><div class="shade"></div></div>
  <div class="run"><span><b>AT THE CALIPER</b> &nbsp;·&nbsp; MC20 BRAKE LINES</span><span class="count">02<i> / 03</i></span></div>
  <div class="pin" style="--px:450px;--py:582px;--d:150px"><div class="ring"></div><span class="lab">This is the line the kit replaces</span></div>
  <div class="head"><div class="display">The swap happens here.</div></div>
  <div class="body2 body">FD braided lines replace the factory hose at each caliper.</div>
  <div class="fine">The hose sits behind the wheel. Shown: MC20 at the FD shop.</div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
