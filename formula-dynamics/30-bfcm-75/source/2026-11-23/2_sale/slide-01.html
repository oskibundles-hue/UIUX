<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../day.css">
<style>
.photo{height:1350px}
.photo img{--x:50%;--y:100%;--zoom:1}
.photo .shade{background:linear-gradient(180deg,#08080A 0%,rgba(8,8,10,.9) 24%,rgba(8,8,10,.2) 40%,rgba(8,8,10,.1) 56%,rgba(8,8,10,.9) 70%,#08080A 78%)}
.top{position:absolute;left:var(--sx);right:var(--sx);top:140px;z-index:4}
.top .kicker{margin-top:22px}

.split{position:absolute;left:var(--sx);right:var(--sx);top:1000px;display:grid;grid-template-columns:1fr 1fr;gap:0 40px;z-index:4}
.split div{border-top:3px solid var(--red);padding-top:16px}
.split .pc{font-family:"Bebas";font-size:120px;line-height:.85;color:var(--white)}
.split p{font-family:"Barlow";font-weight:700;font-size:32px;line-height:1.1;text-transform:uppercase;letter-spacing:.03em;color:var(--sub);margin-top:8px}

</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/812gts_wheeloff_tech.jpg" alt="Ferrari 812 GTS with the front wheel off, FD technician at the hub, brake disc and red caliper exposed"><div class="shade"></div></div>
  <div class="run"><span><b>FORMULA DYNAMICS SALE</b> &nbsp;·&nbsp; NOV 20 – DEC 4</span><span class="count">01<i> / 03</i></span></div>
  <div class="top">
    <div class="rule"></div>
    <div class="kicker">The brake project</div>
    <div class="display">Wheels off<br>before Dec 4?</div>
  </div>
  <div class="split">
    <div><div class="pc">20%</div><p>FD pads and<br>FD brake lines</p></div>
    <div><div class="pc">5%</div><p>Brembo big<br>brake kits</p></div>
  </div>
  <div class="tagrow"><div class="tag">Shown: 812 GTS, wheel off at the FD shop</div></div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
