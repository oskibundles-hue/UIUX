<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
.photo{height:1350px}
.photo img{--x:50%;--y:62%}
.photo .shade{background:linear-gradient(180deg,rgba(8,8,10,.95) 0%,rgba(8,8,10,.8) 16%,rgba(8,8,10,.3) 28%,rgba(8,8,10,0) 38%,rgba(8,8,10,0) 50%,rgba(8,8,10,.9) 70%,#08080A 100%)}
.top{position:absolute;left:var(--sx);right:var(--sx);top:150px;z-index:4}
.top .kicker{margin-top:22px}
.bot{position:absolute;left:var(--sx);right:200px;bottom:var(--sy);z-index:4}
.bot .display{font-size:124px}
.bot .display .red{color:var(--red)}
.bot .body{font-size:38px;margin-top:20px}
.bot .tag{margin-top:24px}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/purosangue_front_head.jpg" alt="Blue Ferrari Purosangue in the FD shop lot"><div class="shade"></div></div>
  <div class="run"><span><b>FORMULA DYNAMICS SALE</b> &nbsp;·&nbsp; NOV 20 – DEC 4</span><span class="count">01<i> / 03</i></span></div>
  <div class="top"><div class="rule"></div><div class="kicker">Air filter · Ferrari Purosangue</div></div>
  <div class="bot">
    <div class="display">Which filter fits<br><span class="red">your Purosangue?</span></div>
    <div class="body">The BMC filter is <b>15% off</b> through Dec 4. Swipe for the numbers it replaces.</div>
    <div class="tag">Shown: Purosangue at the FD shop</div>
  </div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
