<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
/* landscape frame in a tall crop: front fender and wheel */
.photo{height:1350px}
.photo img{--x:62%;--y:50%}
.photo .shade{background:linear-gradient(180deg,rgba(8,8,10,.92) 0%,rgba(8,8,10,.55) 20%,rgba(8,8,10,0) 34%,rgba(8,8,10,0) 58%,rgba(8,8,10,.9) 74%,#08080A 100%)}
.top{position:absolute;left:var(--sx);right:var(--sx);top:150px;z-index:4}
.top .kicker{margin-top:22px}
.bot{position:absolute;left:var(--sx);right:200px;bottom:var(--sy);z-index:4}
.bot .display{font-size:124px}
.bot .display .red{color:var(--red)}
.bot .body{font-size:38px;margin-top:20px}
.bot .tag{margin-top:24px}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/huracanevo_front_fender.jpg" alt="White Huracán EVO front fender and wheel at the FD shop"><div class="shade"></div></div>
  <div class="run"><span><b>READ THE LISTING</b> &nbsp;·&nbsp; LARINI EXHAUST</span><span class="count">01<i> / 03</i></span></div>
  <div class="top"><div class="rule"></div><div class="kicker">Larini GT2 exhaust · Huracán</div></div>
  <div class="bot">
    <div class="display">Read the variant<br><span class="red">before the price</span></div>
    <div class="body">The store has two Larini GT2 listings for the Huracán. Pick the one that names your variant. <b>10% off</b> through Dec 4.</div>
    <div class="tag">Shown: Huracán EVO at the FD shop, Larini available for this model</div>
  </div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
