<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
.photo{height:930px}
.photo img{--x:30%;--y:78%}
.photo .shade{background:linear-gradient(180deg,rgba(8,8,10,.96) 0%,rgba(8,8,10,.85) 16%,rgba(8,8,10,.4) 26%,rgba(8,8,10,0) 38%,rgba(8,8,10,0) 62%,rgba(8,8,10,.85) 88%,#08080A 100%)}
.top{position:absolute;left:var(--sx);right:var(--sx);top:150px;z-index:4}
.top .kicker{margin-top:22px}
.bot{position:absolute;left:var(--sx);right:200px;bottom:var(--sy);z-index:4}
.bot .display{font-size:132px}
.bot .display .red{color:var(--red)}
.bot .body{font-size:38px;margin-top:20px}
.bot .tag{margin-top:24px}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/m4200_rear_wheel_shop.jpg" alt="Rear wheel of a black Maserati 4200 in the FD shop"><div class="shade"></div></div>
  <div class="run"><span><b>REMINDER</b> &nbsp;·&nbsp; FD BRAKE PADS 20% OFF</span><span class="count">01<i> / 03</i></span></div>
  <div class="top"><div class="rule"></div><div class="kicker">Before you add pads to the cart</div></div>
  <div class="bot">
    <div class="display">Your next pad set,<br><span class="red">20% off</span></div>
    <div class="body">Pads are a wear item. Buy the set you will need next at 20% off, through Dec 4.</div>
    <div class="tag">Shown: Maserati 4200 at the FD shop</div>
  </div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
