<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
.photo{height:1350px}
.photo img{--x:22%;--y:50%}
.photo .shade{background:linear-gradient(180deg,rgba(8,8,10,.9) 0%,rgba(8,8,10,.55) 22%,rgba(8,8,10,0) 38%,rgba(8,8,10,0) 58%,rgba(8,8,10,.86) 76%,#08080A 100%)}
.top{position:absolute;left:var(--sx);right:var(--sx);top:150px;z-index:4}
.top .kicker{margin-top:22px}
.bot{position:absolute;left:var(--sx);right:200px;bottom:var(--sy);z-index:4}
.bot .display{font-size:176px}
.bot .display .red{color:var(--red)}
.bot .body{font-size:40px;margin-top:20px}
.bot .tag{margin-top:24px}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/f430spider_wheel_caliper.jpg" alt="Red Ferrari F430 Spider front wheel and red caliper, FD shop"><div class="shade"></div></div>
  <div class="run"><span><b>FORMULA DYNAMICS SALE</b> &nbsp;·&nbsp; NOV 20 – DEC 4</span><span class="count">01<i> / 03</i></span></div>
  <div class="top">
    <div class="rule"></div>
    <div class="kicker">FD stainless braided brake lines</div>
  </div>
  <div class="bot">
    <div class="display"><span class="red">$268</span> a kit</div>
    <div class="body"><b>20% off, was $335.</b> Listed for 22 Ferrari and Maserati models, through Dec 4. Swipe to find yours.</div>
    <div class="tag">Shown: F430 Spider at the FD shop</div>
  </div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
