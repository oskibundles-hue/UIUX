<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../day.css"><link rel="stylesheet" href="../../bf.css">
<style>
.photo{height:1350px}
.photo img{--y:52%;--zoom:1.05}
.photo .shade{background:linear-gradient(180deg,#08080A 0%,rgba(8,8,10,.92) 40%,rgba(8,8,10,.35) 52%,rgba(8,8,10,0) 60%,rgba(8,8,10,.85) 80%,#08080A 100%)}
.days{position:absolute;left:var(--sx);right:var(--sx);top:150px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;z-index:4}
.d{border:2px solid var(--line);padding:12px 0 10px;text-align:center;background:rgba(8,8,10,.6)}
.d .m{font-family:"Plex";font-size:21px;letter-spacing:.08em;color:var(--grey)}
.d .n{font-family:"Bebas";font-size:72px;line-height:.9;color:var(--white)}
.d.today{border-color:var(--white)}
.d.today .m{color:var(--white);font-weight:700}
.d.last{background:var(--red);border-color:var(--red)}
.d.last .m{color:var(--white);font-weight:700}
.hd{top:330px}
.hd .kicker{margin-bottom:12px}
.hd .display{font-size:120px}
.bot{position:absolute;left:var(--sx);right:200px;bottom:var(--sy);z-index:4}
.bot .body{font-size:40px}
.bot .tag{margin-top:22px}
/* bf-nudge */.bf .days{top:172px}</style></head><body>
<div class="slide bf"><div class="bfb"><b>BLACK FRIDAY SALE</b><span>ENDS DEC 4 &nbsp;·&nbsp; 01<i> / 03</i></span></div>
  <div class="photo"><img src="../../../assets/photos/urus_rear_shop.jpg" alt="Grey Lamborghini Urus from the rear in the FD shop"><div class="shade"></div></div>
  <div class="run"><span><b>SALE REMINDER</b> &nbsp;·&nbsp; GIFT IDEA</span><span class="count">01<i> / 03</i></span></div>
  <div class="days">
    <div class="d today"><div class="m">TODAY</div><div class="n">29</div></div>
    <div class="d"><div class="m">NOV</div><div class="n">30</div></div>
    <div class="d"><div class="m">DEC</div><div class="n">1</div></div>
    <div class="d"><div class="m">DEC</div><div class="n">2</div></div>
    <div class="d"><div class="m">DEC</div><div class="n">3</div></div>
    <div class="d last"><div class="m">LAST DAY</div><div class="n">4</div></div>
  </div>
  <div class="hd"><div class="kicker">Larini · Lamborghini Urus</div><div class="display">Gift the exhaust before Dec 4</div></div>
  <div class="bot">
    <div class="body"><b>10% off Larini exhaust</b> ends Dec 4. One Urus piece, one gift checklist. Swipe.</div>
    <div class="tag">Shown: Urus at the FD shop</div>
  </div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
