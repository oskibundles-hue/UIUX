<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../day.css">
<style>
/* split: two details of the FD shop side by side, then the shop's invite */
.split{position:absolute;left:0;top:0;width:1080px;height:760px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.split .photo{position:relative;width:auto;height:760px}
.split .photo .shade{background:linear-gradient(180deg,rgba(8,8,10,.88) 0%,rgba(8,8,10,0) 22%,rgba(8,8,10,0) 70%,#08080A 100%)}
.a img{--y:42%}
.b img{--y:55%}
.head{position:absolute;left:var(--sx);right:var(--sx);top:730px}
.head .display{font-size:112px}
.head .body{font-size:36px;margin-top:16px}
.cta{bottom:180px;flex-direction:column;align-items:flex-start}
.cta .btn{font-size:54px}
.cta .h{font-family:"Plex";font-size:23px;white-space:nowrap;color:var(--white);margin-top:16px;letter-spacing:.02em}

</style></head><body>
<div class="slide">
  <div class="split">
    <div class="photo a"><img src="../../../assets/photos/shop_floor_lifts_tech.jpg" alt="Technician at work on the FD shop floor, lifts and parts racking behind"><div class="shade"></div></div>
    <div class="photo b"><img src="../../../assets/photos/shop_exhaust_stand.jpg" alt="Exhaust system on a display stand in the FD showroom"><div class="shade"></div></div>
  </div>
  <div class="run"><span><b>COME SEE THE FLOOR</b> &nbsp;·&nbsp; FD SHOP</span><span class="count">03<i> / 03</i></span></div>
  <div class="head">
    <div class="display">Run the list on us</div>
    <div class="body">Bring the listing you're looking at, and your car's year and model. Then ask us all four.</div>
  </div>
  <div class="cta"><span class="btn">Book your build</span><span class="h">formuladynamicsperformance.com · @formuladynamicsperformance</span></div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
  <div class="tag" style="position:absolute;left:var(--sx);bottom:var(--sy)">Shown: the FD shop floor and showroom</div>
</div></body></html>
