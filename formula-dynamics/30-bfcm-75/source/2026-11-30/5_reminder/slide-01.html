<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../day.css"><link rel="stylesheet" href="../../bf.css">
<style>
.photo{height:800px}
.photo img{--x:12%;--y:50%}
.photo .shade{background:linear-gradient(180deg,rgba(8,8,10,.9) 0%,rgba(8,8,10,.3) 14%,rgba(8,8,10,0) 30%,rgba(8,8,10,0) 56%,#08080A 100%)}
.topshade{position:absolute;left:0;right:0;top:0;height:220px;background:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,0))}
.bot{position:absolute;left:var(--sx);right:var(--sx);bottom:var(--sy);z-index:4}
.bot .kicker{margin-top:22px}
.bot .display{font-size:150px;margin-top:8px}
.bot .display .red{color:var(--red)}
.bot .body{font-size:38px;margin-top:26px;margin-right:140px}
.bot .tag{margin-top:22px}
</style></head><body>
<div class="slide bf"><div class="bfb"><b>BLACK FRIDAY SALE</b><span>ENDS DEC 4 &nbsp;·&nbsp; 01<i> / 03</i></span></div>
  <div class="photo"><img src="../../../assets/photos/shop_parts_shelves_staff.jpg" alt="Parts shelves at the FD shop"><div class="shade"></div><div class="topshade"></div></div>
  <div class="run"><span><b>MONDAY NIGHT</b> &nbsp;·&nbsp; 4 DAYS LEFT</span><span class="count">01<i> / 03</i></span></div>
  <div class="bot">
    <div class="rule"></div>
    <div class="kicker">Small parts, same sale</div>
    <div class="display">Three parts<br>under <span class="red">$100</span></div>
    <div class="body">Each one is listed at 15% or 20% off through <b>Friday, Dec 4</b>.</div>
    <div class="tag">Shown: parts shelves at the FD shop</div>
  </div>
</div></body></html>
