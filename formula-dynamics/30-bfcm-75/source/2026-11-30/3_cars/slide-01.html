<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../day.css">
<style>
/* macro crop: the F430's front corner a few inches off the asphalt */
.photo{height:1350px}
.photo img{--x:0%;--y:100%}
.photo .shade{background:linear-gradient(180deg,#08080A 0%,rgba(8,8,10,.92) 34%,rgba(8,8,10,.55) 46%,rgba(8,8,10,0) 58%,rgba(8,8,10,0) 84%,rgba(8,8,10,.7) 100%)}
.bot{position:absolute;left:var(--sx);right:var(--sx);top:150px;z-index:4}
.bot .kicker{margin-top:22px}
.bot .display{font-size:140px;margin-top:10px}
.bot .display .red{color:var(--red)}
.bot .body{font-size:38px;margin-top:22px;margin-right:140px}
.tag.pin{position:absolute;left:var(--sx);bottom:var(--sy);z-index:5}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/f430spider_frontlip_ground.jpg" alt="Red Ferrari F430 front corner close to the ground"><div class="shade"></div></div>
  <div class="run"><span><b>CAR + PART</b> &nbsp;·&nbsp; FERRARI F430</span><span class="count">01<i> / 03</i></span></div>
  <div class="bot">
    <div class="rule"></div>
    <div class="kicker">Ferrari F430 · KW HLS 2</div>
    <div class="display">Low nose,<br><span class="red">steep driveway?</span></div>
    <div class="body">KW's front-axle lift system is listed for the F430 and the Spider. <b>5% off through Dec 4.</b></div>
  </div>
  <div class="tag pin">Shown: F430 Spider at the FD shop</div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
