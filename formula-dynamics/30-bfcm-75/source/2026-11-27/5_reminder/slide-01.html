<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../day.css">
<style>
.photo{height:1350px}
.photo img{--y:50%;--zoom:1;--ox:50%;--oy:50%}
.photo .shade{background:linear-gradient(180deg,rgba(8,8,10,.95) 0%,rgba(8,8,10,.8) 30%,rgba(8,8,10,.35) 52%,rgba(8,8,10,.55) 68%,#08080A 92%)}
.top{position:absolute;left:var(--sx);right:var(--sx);top:150px;z-index:4}
.top .display{font-size:150px;margin-top:18px}
.top .display .red{color:var(--red)}
.big{position:absolute;left:var(--sx);right:var(--sx);top:880px;z-index:4;display:flex;align-items:flex-end;gap:28px}
.big .n{font-family:"Bebas";font-size:300px;line-height:.8;color:var(--red)}
.big .w{font-family:"Bebas";font-size:72px;line-height:.92;text-transform:uppercase;padding-bottom:8px}
.big .w span{display:block;font-family:"Plex";font-size:24px;letter-spacing:.06em;color:var(--sub);margin-top:10px}
.bot{position:absolute;left:var(--sx);right:200px;bottom:var(--sy);z-index:4}
.bot .tag{margin-top:0}
</style></head><body>
<div class="slide">
  <div class="photo"><img src="../../../assets/photos/shop_lounge_wheels.jpg" alt="Wheels on display in the FD shop lounge"><div class="shade"></div></div>
  <div class="run"><span><b>FRIDAY NIGHT</b> &nbsp;·&nbsp; NOV 27</span><span class="count">01<i> / 03</i></span></div>
  <div class="top"><div class="rule"></div><div class="kicker">Black Friday ends tonight</div><div class="display">The sale<br><span class="red">doesn't.</span></div></div>
  <div class="big"><div class="n">7</div><div class="w">more days<span>NOV 28 – DEC 4, 2026</span></div></div>
  <div class="bot"><div class="tag">Shown: the FD shop lounge</div></div>
  <div class="mark icon"><img src="../../../assets/logos/fd-icon-white.png" alt="FD"></div>
</div></body></html>
