<!--
  FD MC20 PPF full process -- "Locked-On ABC" v2 graphics layer (4 Oct 2026; v1 = lo_v1.html).
  v2 (review of v1): every lock is cut at its shot's last frame and its exit ends before the cut; tracks hold their last
  position; WRAP card narrowed clear of the shirt emblem; hook panel over dimmed #36 (compose_lo.py); no lock on #32 (it sat
  under Instagram's buttons); the reveal chip appears in place instead of rising as a slab. Omarie: "Can I get an ABC mix for Locked On as
  well? I love the Locked On. That's the classic way to go." Classic FD Locked-On first (frame-0 hook panel, tracked lock-on
  brackets per step, kinetic STEP cards, whips and impacts in compose_lo.py, the FD end card v4 built in the Locked-On way),
  with the A / B / C 3D moments as upgrades inside that language:
    0-4    HOOK panel, complete on frame 0 (PAINT PROTECTION FILM / EVERY INCH / BY HAND / FD logo); brackets lock onto it
    4-24   PREP & CLEAN (#37 lock: MICROFIBRE), PEEL THE FILM (#27 lock: BY HAND), LAY THE FILM (#32 lock on the hand)
    24-31  SQUEEGEE: brackets lock onto the wet film on #33, A's FILM / CLEAR COAT / PAINT chip rises out of the box, seals
    31-38  TRIM: B's extruded red-black TRIM slams in as the STEP card, standing on the red rail; lock on the blade (#38)
    38-48  WRAP THE EDGES: C's traced edge, scan curtain and mesh; the brackets snap onto the tracked edge (FILM EDGE, PANEL EDGE)
    48-55  REVEAL: lock-on on the trident on the drop (MASERATI / MC20), A's layer split over the hood, whip into
    55-64  the FD end card v4 (fdc.js cardFD: black wipe, bands in one by one, light sweep; settles on the approved card)
  Beats at 128 BPM from 0.000 s; window.renderAt(t) is pure in t.
-->

<div id="sig" class="a"></div>
<canvas id="cv" class="a" width="1080" height="1920"></canvas>

<div id="dom" class="a"></div>
<div id="stage" class="a" style="width:1080px;height:1920px"></div>
<script>
const D = D3, E = D.E, FPS = D.FPS, B = D.BEAT, SC = window.SCENE;
const KE = KT.ease, KP = KT.p, cl = KT.cl, lerp = KT.lerp;
const { ink, line, el: sel, show, svgEl, svgRoot, glint, bracketSet, bracketDraw, grow, lerpRect, padRect, pingSet, pingDraw, f2, sigSvg, SAFE } = SEK.helpers;
const RED = '#FE0F13';
const fb = b => Math.round(b * B * FPS), tb = b => fb(b) / FPS;
const cv = document.getElementById('cv'), g = cv.getContext('2d'), dom = document.getElementById('dom'), stage = document.getElementById('stage');
const el = (cls, css, html) => { const d = document.createElement('div'); d.className = cls; d.style.cssText += css; if (html != null) d.innerHTML = html; dom.appendChild(d); return d; };
const fit = (fam, text, maxW, maxS, ls) => Math.min(maxS, maxS * maxW / ink(fam, maxS, text, ls).w);
const pad2 = v => String(v).padStart(2, '0');

// ================================================================ tracked boxes (screen px; plates are full frame, 1:1)
function lockBox(key, t) {
  const s = SC.shots.find(x => x.key === key), L = SC.locks[key]; if (!s || !L) return null;
  const gi = t * FPS; if (gi < s.g0 - 0.5 || gi >= s.g1 - 0.5) return null;
  const n = L.frames.length, x = Math.max(0, Math.min(n - 1, s.off + (gi - s.g0) - L.f0));   // v2: hold the first / last tracked position
  const i = Math.max(0, Math.min(n - 1, Math.floor(x))), j = Math.min(n - 1, i + 1), u = Math.min(1, Math.max(0, x - i)), a = L.frames[i], b = L.frames[j];
  return { x: lerp(a[0], b[0], u), y: lerp(a[1], b[1], u), w: lerp(a[2], b[2], u), h: lerp(a[3], b[3], u) };
}

// ================================================================ Locked-On lock: brackets snap in (1.7x -> 1x over 8 frames), ping, hold on the
// track, shrink out. A compact tag chip (red square + name) at the box's top-left corner, or a full label (kicker + name,
// stripe cap, leader line) for the badge lock. FD red throughout; the ping flashes the brackets toward white, never gold.
function makeLock(o) {
  const root = sel('div', 'a', stage, 'width:1080px;height:1920px');
  const svg = svgRoot(root), Bk = bracketSet(svg), pings = pingSet(svg);
  const lu = svgEl('path', { fill: 'none', stroke: 'rgba(0,0,0,.45)', 'stroke-width': 8 }, svg), lo = svgEl('path', { fill: 'none', stroke: RED, 'stroke-width': 3 }, svg);
  const dot = svgEl('circle', { r: 6.5, fill: RED }, svg);
  let chip = null, CW = 0, CH = 0, lab = null, LW = 0, LH = 0, kk = null, nm = null, stripe = null;
  if (o.tag) {
    const fs = 30, ls = 0.16; CW = Math.ceil(ink('Michroma', fs, o.tag, ls).w + 38 + 22); CH = 52;
    chip = sel('div', 'a', root, `width:${CW}px;height:${CH}px;background:rgba(0,0,0,.9);box-shadow:0 8px 24px rgba(0,0,0,.3)`);
    sel('div', 'a', chip, `left:16px;top:${(CH - 12) / 2}px;width:12px;height:12px;background:${RED}`);
    line(chip, 'Michroma', fs, o.tag, 38, (CH - ink('Michroma', fs, 'H', ls).aA) / 2, '#fff', { ls, split: false });
  }
  if (o.label) {
    const ns = Math.min(84, 84 * 640 / ink('Bebas', 84, o.label.name).w), capN = ink('Bebas', ns, 'H').aA;
    LW = Math.ceil(Math.max(ink('Michroma', 24, o.label.kicker, 0.2).w, ink('Bebas', ns, o.label.name).w) + 64); LH = Math.round(28 + 18 + 20 + capN + 28);
    lab = sel('div', 'a', root, `width:${LW}px;height:${LH}px`);
    sel('div', 'a', lab, `width:${LW}px;height:${LH}px;background:rgba(0,0,0,.9);box-shadow:0 10px 30px rgba(0,0,0,.3)`);
    stripe = sel('div', 'a stripe', lab, `width:${LW}px;height:6px`);
    kk = line(lab, 'Michroma', 24, o.label.kicker, 32, 28, RED, { mask: true, ls: 0.2 });
    nm = line(lab, 'Bebas', ns, o.label.name, 30, 28 + 18 + 20, '#fff', { mask: true });
  }
  const rise = (ln, t, st) => { const q = KE.outExpo(KP(t, st, st + 0.32)); ln.t.style.transform = `translateY(${(108 * (1 - q)).toFixed(3)}%)`; ln.t.style.opacity = q > 0 ? 1 : 0; };
  return { o, root, render(t) {
    const ta = o.ta, tx = o.tx, gf = t * FPS, on = t >= ta - 1e-6 && t < tx + 0.3 && gf >= o.g0 - 0.5 && gf < o.g1 - 0.5; show(root, on); if (!on) return;
    const b = o.boxAt(t); if (!b) { show(root, false); return; }
    const tgt = padRect(b, o.pad ?? 12);
    const qa = KE.outExpo(cl((t - ta) * FPS / 8));
    let r = lerpRect(grow(tgt, 1.7), tgt, qa);
    const tl = ta + 0.26, pl = t >= tl ? Math.exp(-(t - tl) * 14) * Math.min(1, (t - tl) * FPS / 1.5) : 0;
    r = grow(r, (1 + 0.06 * pl) * (1 - 0.5 * KE.inCubic(KP(t, tx + 0.06, tx + 0.26))));
    const pp = bracketDraw(Bk, r, { maxL: o.maxL ?? 46 });
    Bk.bo.setAttribute('stroke', pl > 0.05 ? `rgb(255,${Math.round(15 + 225 * pl)},${Math.round(19 + 221 * pl)})` : RED);
    [Bk.tu, Bk.to].forEach(e => e.setAttribute('opacity', cl(qa * 1.4 - 0.4).toFixed(3)));
    pingDraw(pings, tgt, t, tl);
    svg.style.opacity = (cl(qa * 3) * (1 - KE.inCubic(KP(t, tx + 0.1, tx + 0.26)))).toFixed(4);
    const tin = ta + 0.28, qp = KE.outExpo(KP(t, tin, tin + 0.3)), qpo = KE.inCubic(KP(t, tx, tx + 0.2));
    const right = qpo > 0 ? 100 * qpo : 100 * (1 - qp), clip = right > 0.001 ? `inset(-40px ${right.toFixed(3)}% -40px 0)` : 'inset(-40px 0 -40px 0)';
    let lead = '';
    if (chip) {
      let cy = r.y - CH - 12; if (cy < SAFE.y0) cy = r.y + r.h + 12;
      const cx = cl(r.x, SAFE.x0, SAFE.x1 - CW); cy = cl(cy, SAFE.y0, SAFE.y1 - CH);
      chip.style.transform = `translate(${f2(cx)}px,${f2(cy)}px)`; chip.style.clipPath = clip; chip.style.display = qp > 0 && qpo < 1 ? 'block' : 'none';
      [lu, lo, dot].forEach(e => e.setAttribute('opacity', 0));
    }
    if (lab) {
      const b0 = o.boxAt(ta + 0.3) || b, t0r = padRect(b0, o.pad ?? 12);
      const lx = cl(t0r.x - 20 + 0.45 * (tgt.x - t0r.x), SAFE.x0, SAFE.x1 - LW), ly = cl(t0r.y - 70 - LH + 0.45 * (tgt.y - t0r.y), SAFE.y0, SAFE.y1 - LH);
      lab.style.transform = `translate(${f2(lx)}px,${f2(ly)}px)`; lab.style.clipPath = clip; lab.style.display = qp > 0 && qpo < 1 ? 'block' : 'none';
      const bx = r.x, by = r.y, Ax = cl(bx, lx + 20, lx + LW - 20), Ay = ly + LH;
      const qL = KE.inOutCubic(KP(t, ta + 0.2, ta + 0.44)) * (1 - KE.inCubic(KP(t, tx, tx + 0.14)));
      const len = Math.hypot(Ax - bx, Ay - by); lead = `M${f2(bx)},${f2(by)}L${f2(Ax)},${f2(Ay)}`;
      [lu, lo].forEach(e => { e.setAttribute('d', lead); e.setAttribute('opacity', 1); e.setAttribute('stroke-dasharray', `${f2(len * qL)} ${f2(len + 20)}`); });
      dot.setAttribute('cx', f2(bx)); dot.setAttribute('cy', f2(by)); dot.setAttribute('opacity', qL > 0 && t < tx + 0.14 ? 1 : 0);
      KT.drawStripe(stripe, t, { start: tin + 0.04, dur: 0.26 }); rise(kk, t, tin + 0.08); rise(nm, t, tin + 0.12);
      glint(nm, t, tin + 0.7, 0.5);
    }
    sigSvg(svg, pp.br + lead + qa.toFixed(3));
  } };
}

// ================================================================ HOOK: Locked-On panel, complete on frame 0
function makeHook() {
  const x = 54, w = 853, X = 40;
  const root = sel('div', 'a', stage, 'width:1080px;height:1920px');
  const S = Math.min(fit('Bebas', 'EVERY INCH', w - 2 * X, 236), fit('Bebas', 'BY HAND', w - 2 * X, 236));
  const capE = ink('Michroma', 26, 'H', 0.24).aA, cap = ink('Bebas', S, 'H').aA;
  const y1 = 44 + capE + 34, y2 = y1 + cap + 24, lw = 300, lh = lw * 1678 / 4000, ly = y2 + cap + 46, Hh = Math.round(ly + lh + 44);
  const y = Math.round(960 - Hh / 2);
  const clip = sel('div', 'a', root, `left:${x}px;top:${y}px;width:${w}px;height:${Hh}px;overflow:hidden`);
  sel('div', 'a', clip, `width:${w}px;height:${Hh}px;background:#000`);
  const inner = sel('div', 'a', clip, `width:${w}px;height:${Hh}px`);
  const eb = line(inner, 'Michroma', 26, 'PAINT PROTECTION FILM', X, 44, RED, { ls: 0.24 });
  const l1 = line(inner, 'Bebas', S, 'EVERY INCH', X, y1, '#fff', { mask: true });
  const l2 = line(inner, 'Bebas', S, 'BY HAND', X, y2, RED, { mask: true });
  const logoW = sel('div', 'a', inner, `left:${X}px;top:${ly}px;width:${lw}px;height:${lh.toFixed(2)}px`);
  const img = sel('img', '', logoW, `width:${lw}px;display:block`); img.src = 'logos/fd-primary-horizontal--white.png';
  const stripe = sel('div', 'a stripe', root, `left:${x}px;top:${y}px;width:${w}px;height:8px`);
  const sweep = sel('div', 'a', root, `left:${x}px;top:${y}px;width:${w}px;height:8px;overflow:hidden`);
  const sweepBar = sel('div', 'a', sweep, 'width:120px;height:8px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95),rgba(255,255,255,0))');
  const redge = sel('div', 'a', root, `left:${x}px;top:0;width:${w}px;height:3px;background:${RED};box-shadow:0 0 14px 3px rgba(254,15,19,.55);opacity:0`);
  const svg = svgRoot(root), Bk = bracketSet(svg, { over: 5 }), pings = pingSet(svg);
  const box = { x, y, w, h: Hh };
  const x0 = tb(4) - 0.40, TA = 0.42;                      // brackets lock onto the panel on beat 1; the panel lifts out before the whip
  return { box, render(t) {
    const on = t < x0 + 0.42; show(root, on); if (!on) return;
    KT.glint(l1.g, t, { start: 0.28, dur: 0.5, base: '#FFFFFF', warm: '#FFFFFF', hot: RED, width: 0.2 * l1.g.W, angle: 106 });
    glint(l2, t, 0.85, 0.45, { base: RED, warm: '#FF5A5D', hot: '#FFFFFF', w: 0.18, glow: 8 });
    const qs = KP(t, 1.0, 1.4); sweepBar.style.display = qs > 0 && qs < 1 ? 'block' : 'none';
    sweepBar.style.transform = `translateX(${(-120 + (w + 240) * KE.inOutCubic(qs)).toFixed(2)}px)`;
    const qp = KE.inOutCubic(KP(t, x0, x0 + 0.26));
    inner.style.transform = qp > 0 ? `translateY(${(-80 * qp).toFixed(2)}px)` : 'none';
    clip.style.clipPath = qp > 0 ? `inset(0 0 ${(100 * qp).toFixed(3)}% 0)` : 'none';
    redge.style.opacity = qp > 0 && qp < 1 ? Math.min(1, Math.sin(Math.PI * qp) * 2).toFixed(4) : 0;
    redge.style.transform = `translateY(${(y + Hh * (1 - qp) - 2).toFixed(2)}px)`;
    const qst = KE.inExpo(KP(t, x0 + 0.2, x0 + 0.38));
    stripe.style.transformOrigin = 'right center'; stripe.style.transform = qst > 0 ? `scaleX(${(1 - qst).toFixed(5)})` : 'none'; stripe.style.opacity = qst >= 1 ? 0 : 1;
    // brackets on the panel corners
    const qa = KE.outExpo(cl((t - TA) * FPS / 8)), tl = TA + 0.26;
    const pl = t >= tl ? Math.exp(-(t - tl) * 14) * Math.min(1, (t - tl) * FPS / 1.5) : 0;
    let r = lerpRect(grow(box, 1.25), box, qa); r = grow(r, (1 + 0.025 * pl) * (1 - 0.3 * KE.inCubic(KP(t, x0, x0 + 0.2))));
    const pp = bracketDraw(Bk, r, { maxL: 64 });
    Bk.bo.setAttribute('stroke', pl > 0.05 ? `rgb(255,${Math.round(15 + 225 * pl)},${Math.round(19 + 221 * pl)})` : RED);
    [Bk.tu, Bk.to].forEach(e => e.setAttribute('opacity', 0));
    pingDraw(pings, box, t, tl);
    svg.style.opacity = (t < TA ? 0 : cl(qa * 3) * (1 - KE.inCubic(KP(t, x0 + 0.05, x0 + 0.22)))).toFixed(4);
    sigSvg(svg, pp.br + qa.toFixed(3));
  } };
}

// ================================================================ kinetic STEP card (fdc.js stepCard + max size / top placement)
function makeStep(cfg) {
  const p = Object.assign({ n: 1, total: 6, label: 'STEP', title: '', x: 62, bottom: 1500, top: null, maxW: 800, maxS: 176, exitDur: 0.2, slam: 1.45 }, cfg);
  const root = sel('div', 'a', stage, 'width:1080px;height:1920px');
  const S = fit('Bebas', p.title, p.maxW, p.maxS), cap = ink('Bebas', S, 'H').aA, tw = ink('Bebas', S, p.title).w;
  const tagTxt = `${p.label} ${pad2(p.n)} / ${pad2(p.total)}`;
  let segY = p.bottom - 8, stY = segY - 34, tiY = stY - 22 - cap, tagY = tiY - 52;
  if (p.top != null) { const d = p.top - tagY; segY += d; stY += d; tiY += d; tagY += d; }
  const scrim = p.top != null
    ? sel('div', 'a', root, `left:0;top:0;width:1080px;height:${segY + 300}px;background:linear-gradient(0deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.42) 45%,rgba(0,0,0,.55) 100%)`)
    : sel('div', 'a', root, 'left:0;top:1020px;width:1080px;height:900px;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.5) 45%,rgba(0,0,0,.62) 100%)');
  const cw = ink('Michroma', 30, tagTxt, 0.3).w;
  const chipEl = sel('div', 'a', root, `left:${p.x - 12}px;top:${tagY - 10}px;width:${(cw + 30).toFixed(1)}px;height:50px;background:rgba(0,0,0,.88);transform-origin:left center`);
  const tag = line(root, 'Michroma', 30, tagTxt, p.x, tagY, RED, { ls: 0.3 });
  const holder = sel('div', 'a', root, `width:1080px;height:1920px;transform-origin:${p.x}px ${tiY + cap}px`);
  const mask = sel('div', 'a', holder, `left:0;top:${tiY - 30}px;width:1080px;height:${cap + 60}px;overflow:hidden`);
  const ti = line(mask, 'Bebas', S, p.title, p.x, 30, '#fff');
  const stripe = sel('div', 'a stripe', root, `left:${p.x}px;top:${stY}px;width:${tw.toFixed(1)}px;height:10px`);
  const edge = sel('div', 'a edge', root, `left:${p.x}px;top:${stY - 11}px;height:32px;opacity:0`);
  const segs = [], SW = 58, SG = 10;
  for (let i = 0; i < p.total; i++) segs.push(sel('div', 'a', root, `left:${p.x + i * (SW + SG)}px;top:${segY}px;width:${SW}px;height:8px;background:${i < p.n - 1 ? '#fff' : i === p.n - 1 ? RED : 'rgba(255,255,255,.22)'};transform-origin:left center`));
  const flash = sel('div', 'a', root, `left:${p.x - 60}px;top:${tiY - 50}px;width:${tw + 160}px;height:${cap + 100}px;background:radial-gradient(ellipse at 30% 50%,rgba(255,240,235,.45) 0%,rgba(254,15,19,.2) 40%,rgba(254,15,19,0) 70%);opacity:0`);
  return { p, render(t) {
    const x0 = p.t1 - p.exitDur, on = t >= p.t0 && t < p.t1; show(root, on); if (!on) return;
    const t0 = p.t0, th = t0 + 0.12;
    const qs = KE.outExpo(KP(t, t0, th + 0.06)), qo = KE.inCubic(KP(t, x0, p.t1));
    scrim.style.opacity = (KE.outCubic(KP(t, t0, t0 + 0.2)) * (1 - qo)).toFixed(3);
    holder.style.transform = `scale(${lerp(p.slam, 1, qs).toFixed(5)}) translateY(${(-cap * 0.3 * qo).toFixed(2)}px)`;
    holder.style.opacity = (1 - qo).toFixed(4);
    ti.w.style.opacity = cl(KP(t, t0, t0 + 0.05)).toFixed(3);
    const hit = t >= th ? Math.exp(-(t - th) * 7) : 0;
    flash.style.opacity = (0.4 * hit * (1 - qo)).toFixed(3);
    const qst = KE.outExpo(KP(t, th, th + 0.34));
    stripe.style.transform = `scaleX(${qst.toFixed(5)})`; stripe.style.opacity = (1 - qo).toFixed(3);
    edge.style.opacity = (qst > 0 && qst < 1 ? Math.sin(Math.PI * qst) : 0).toFixed(3);
    edge.style.transform = `translateX(${(tw * qst).toFixed(2)}px)`;
    KT.track(tag.g, t, { start: th, dur: 0.34, spread: 2.0 }); tag.w.style.opacity = (1 - qo).toFixed(3);
    chipEl.style.transform = `scaleX(${KE.outExpo(KP(t, th - 0.04, th + 0.24)).toFixed(4)})`; chipEl.style.opacity = (1 - qo).toFixed(3);
    segs.forEach((s, i) => {
      const q = i === p.n - 1 ? KE.outExpo(KP(t, th + 0.16, th + 0.46)) : KE.outCubic(KP(t, th + 0.1 + 0.025 * i, th + 0.3 + 0.025 * i));
      s.style.transform = `scaleX(${q.toFixed(4)})`; s.style.opacity = (1 - qo).toFixed(3);
    });
    glint(ti, t, th + 0.5, 0.5, { w: 0.2, glow: 10 });
    if (t >= th - 0.001) { const k = (t - th) * FPS, amp = Math.exp(-k / 2.2);
      if (k < 12) window.FX.punch = { s: 1 + 0.045 * Math.exp(-(t - th) * 9), dx: 9 * amp * Math.sin(k * 2.1), dy: 7 * amp * Math.cos(k * 2.7) }; }
  } };
}

// ================================================================ A: the cross-section chip (SQUEEGEE on #33, REVEAL on #29) -- from abc-mix v3,
// plus o.trace=false (the Locked-On brackets are the box the chip rises out of) and render.foot(gi) = the footprint's screen box
function makeChip(o) {

    const edge = D.partial(line_(u => P(u, 0), 60), tr);
    glowLine(edge, '#FE0F13', riser ? 5 : 4, riser ? 22 : 14, fade);
    const ta = D.p(lb, 0.6, 1.1) * fade;
    if (ta > 0) for (let i = 0; i <= 10; i++) { const u = i / 10; if (u > tr) break; glowLine([P(u, -0.10), P(u, 0.04)], 'rgba(254,15,19,.85)', 2.2, 8, ta); }
  }
}

// ================================================================ build the timeline
let hook, steps = [], locks = [], card;
window.FX = {};
window.renderAt = function (t) {
  window.FX = { glass: [] };
  const bt = t / B, gf = t * FPS;
  D.sig(bt < 55 ? t : 0);
  g.clearRect(0, 0, 1080, 1920);
  hook.render(t);
  steps.forEach(s => s.render(t));

  locks.forEach(l => l.render(t));

  if (!FX.glass.length) delete FX.glass;
};

  // lock-ons (times in beats; each holds on its tracked subject and leaves before the next cut)
  // v2: each lock belongs to one shot; it never draws outside [g0, g1) and its exit (tx .. tx + 0.3 s) ends a frame before the cut
  const Lk = (o) => { const s = SC.shots.find(x => x.key === o.shot); const tx = Math.min(tb(o.x), (s.g1 - 1) / FPS - 0.30);
    locks.push(makeLock(Object.assign(o, { ta: tb(o.a), tx, g0: s.g0, g1: s.g1 }))); };
  Lk({ shot: 's37', a: 4.5, x: 7.55, boxAt: t => lockBox('s37', t), tag: 'MICROFIBRE', pad: 6 });
  Lk({ shot: 's27', a: 14.35, x: 16.2, boxAt: t => lockBox('s27', t), tag: 'BY HAND', pad: 6 });   // gone before the whip into #32
  // v2: no lock on #32 -- the hand sits in the bottom 20 % / right 16 %, half off frame, under Instagram's buttons
  Lk({ shot: 's33', a: 24.22, x: 26.95, boxAt: t => { const b = t * FPS; return b >= fb(24) && b < fb(28) ? chipSq.foot(b) : null; }, tag: 'WET FILM', pad: 26 });
  Lk({ shot: 's38', a: 31.55, x: 34.6, boxAt: t => lockBox('s38', t), tag: 'BLADE', pad: 8 });
  Lk({ shot: 's35', a: 38.7, x: 40.3, boxAt: t => { const b = t / B; return b >= 38 && b < 41 ? pinBox('s35', t) : null; }, tag: 'FILM EDGE', pad: 0 });
  Lk({ shot: 's22', a: 41.45, x: 43.6, boxAt: t => { const b = t / B; return b >= 41 && b < 48 ? pinBox('s22', t) : null; }, tag: 'PANEL EDGE', pad: 0 });
  Lk({ shot: 'r29', a: 48.3, x: 50.9, boxAt: t => lockBox('r29', t), label: { kicker: 'MASERATI', name: 'MC20' }, pad: 14, maxL: 60 });
  card = SEK.cardFD({ code: 'END', t0: tb(55), t1: SC.nf / FPS });
  await Promise.all([...document.images].map(im => im.complete && im.naturalWidth ? 0 : new Promise((r, j) => { im.onload = r; im.onerror = () => j(new Error('missing ' + im.src)); })));
  window.renderAt(0); window.__ktReady = true;
})();

[[4.5, 7.55], [14.35, 16.2], [24.22, 26.95], [31.55, 34.6], [38.7, 40.3], [41.45, 43.6], [48.3, 50.9]].forEach(([a, x]) => { SPANS.push(sp(tb(a), tb(a) + 0.8, 10)); SPANS.push(sp(tb(x) - 0.02, tb(x) + 0.34, 8)); });
SPANS.push(sp(tb(24), tb(28), 6), sp(tb(31), tb(31) + 0.9, 14), sp(tb(37.4), tb(38.1), 12), sp(tb(38), tb(48), 5), sp(tb(48), tb(55), 6), sp(tb(55), tb(55) + 1.0, 10), sp(tb(55) + 1.1, tb(55) + 1.7, 6));
