# Conda environment for .github/workflows/python-package-conda.yml, which runs
# `conda env update --file environment.yml --name base` before linting and testing.
# The repo's Python needs nothing beyond the standard library; flake8 and pytest are
# listed so the workflow's own `conda install flake8` / `conda install pytest` steps
# find them already installed.
name: base
channels:
  - defaults
dependencies:
  - pip
  - flake8
  - pytest
